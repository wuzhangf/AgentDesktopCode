# Read-only profile for questions, audits, and startup/runbook analysis.
server=http://127.0.0.1:8765
workspace=business-agent-code
mode=INSPECT
write.allow=
write.forbid=.git,service-config,target,build
verification.level=NONE
# Keep this aligned with the console that launches the CLI; use UTF-8 for a
# UTF-8-configured Run Console.
input.encoding=UTF-8
limits.max-model-turns=240
limits.max-edit-attempts=100
wait.timeout-seconds=1200
