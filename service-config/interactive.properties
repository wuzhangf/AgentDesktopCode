# Defaults used when BusinessAgentCli starts without arguments.
server=http://127.0.0.1:8765
workspace=business-agent-code
mode=MODIFY
write.allow=src, config, doc, pom.xml
write.forbid=.git, service-config, target, build
verification.level=VERIFY
# IntelliJ/Windows console on this machine uses CP936/GBK. Use UTF-8 here if
# the Run Console is explicitly configured to UTF-8.
input.encoding=UTF-8
limits.max-model-turns=240
limits.max-edit-attempts=100
wait.timeout-seconds=1200
