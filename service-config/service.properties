server.host=127.0.0.1
server.port=8766
# Repo-relative paths: the launch scripts run from the repository root, so the
# config never bakes in a machine-specific absolute checkout path.
state.dir=service-config/state
# Secrets stay out of the config file; the launcher injects CODEAGENT_SERVICE_TOKEN.
auth.token-env=CODEAGENT_SERVICE_TOKEN
model.config=service-config/model-providers.properties
workspace.petclinic=../spring-petclinic-microservices
queue.capacity=20
runs.max-active=6
runs.max-active-per-session=1
runs.scheduler.mode=SHADOW

# Service golden smoke (verification/service-golden-smoke) requires the L1
# process_exec lane: gs-read/gs-write drive the offline Maven gate through it.
process.enabled=true
process.denied-executables=rm,del,erase,rmdir,rd,format,diskpart,sh,bash,zsh,dash,wsl,cmd,cmd.exe,powershell,powershell.exe,pwsh,pwsh.exe,curl,wget,ssh,scp,sftp,nc,ncat,netcat

# Local desktop terminal debug: explicitly restricted to the interactive
# PowerShell user shell. The local-debug-readiness switch only accepts the
# current host's verified WU-PTY-I1 row; the normal two-OS production gate
# remains fail-closed when this switch is absent.
terminal.enabled=true
terminal.allowed-executables=powershell,powershell.exe
terminal.user-shell-enabled=true
terminal.local-debug-readiness=true
terminal.packaged-readiness-manifest=build/pty-local-debug-smoke-gate/pty-packaged-matrix-report.json

# Local desktop default: enable the bounded read-only source adapter.
# The service still enforces http(s), public-address, size, timeout and
# redirect limits in code; an empty allowlist means no extra host restriction.
source.readonly.enabled=true

# Local Web capability smoke: fetch is enabled with the framework's bounded
# public-network policy. Search remains AUTO but reports NOT_CONFIGURED until
# a real Tavily/Brave credential is supplied through a controlled environment.
web.network.mode=public
# This workstation's Meta Tunnel maps public DNS answers into RFC 2544
# 198.18.0.0/15. The framework keeps the flag opt-in and still rejects
# literal reserved-range URLs and every other private/special-purpose range.
web.network.allowSyntheticDnsTunnelAddresses=true
web.fetch.mode=auto
web.search.mode=auto

web.search.provider=tavily
web.search.credentialRef=env:TAVILY_API_KEY

memory.enabled=false
trace.enabled=false

# Incremental OCI sandbox (design 15.1/15.2). AUTO: register sandbox_shell when
# a READY local docker backend is discovered; silently skip when none is.
# Image must be digest-pinned and already installed locally (pull-policy NEVER).
sandbox.mode=AUTO
sandbox.image=codeagent-real@sha256:f0e935ce8b4d38cdd86c63c689dffb39fdf7e7472776335d0f570277afaa1fa3
# Standard mode: safe inspect-only sandbox calls run automatically; sandbox
# modify/writeback remains on the contextual approval surface.
sandbox.approval-mode=RISK_BASED
# Separate owner-only sandbox staging/probe root; the general service state
# directory intentionally keeps its existing persistence and ACL policy.
sandbox.staging-root=service-config/sandbox-state
# Explicit P1 switch: only true after staged merge tests pass.  The default
# remains inspect-only and never writes back to the authoritative workspace.
sandbox.modify.enabled=true

# Java semantic tools (design 2026-08-31). AUTO: expose java_definition/
# java_references/java_diagnostics when JDT LS is configured and the workspace
# is a Java project; degrade explicitly (workspace_search/read still work)
# otherwise. off | auto | required
java.semantic.mode=auto
# Explicit values win; when blank the AGENT_JDTLS_JAVA_HOME / AGENT_JDTLS_HOME
# / AGENT_JDTLS_DATA_ROOT environment variables are used as fallbacks.
java.semantic.java-home=
java.semantic.jdtls-home=
# Defaults to <state.dir>/semantic/jdtls when blank.
java.semantic.data-root=
java.semantic.start-timeout-millis=10000
java.semantic.initialize-timeout-millis=30000
java.semantic.import-timeout-millis=60000
java.semantic.query-timeout-millis=15000
java.semantic.diagnostics-timeout-millis=30000
java.semantic.shutdown-timeout-millis=5000
java.semantic.data-ttl-hours=72

# User-managed specialist profiles. Relative paths are resolved next to this
# service.properties file, so launching the service from another cwd is safe.
agent.profiles.directory=./agents

# Read-only research remains opt-in at the service boundary.
subagent.readonly.mode=ON
# subagent.readonly.workspace.allowlist=petclinic
# Read-only subagent deadlines (milliseconds). These are bounded operator
# settings; they do not widen the fixed read-only task/tool caps.
readonly.subagents.batch-timeout-ms=180000
readonly.subagents.task-execution-timeout-ms=180000
readonly.subagents.model-call-timeout-ms=90000
readonly.subagents.cleanup-grace-ms=1000
