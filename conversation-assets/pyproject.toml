[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xagt-conversation-assets"
version = "0.3.0"
description = "Open conversation asset storage service for xagt.link"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.8,<3",
  "cryptography>=42,<51",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.28,<1"]
s3 = ["botocore>=1.40,<2"]

[project.scripts]
xagt-assets = "xagt_assets.standalone:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xagt_assets = ["schema.sql", "grant_schema.sql"]
