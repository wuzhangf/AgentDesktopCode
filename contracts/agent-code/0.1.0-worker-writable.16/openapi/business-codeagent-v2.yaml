      type: object
      properties:
        executionOwnership: { type: string, nullable: true, enum: [HOST_SESSION, WORKER_ATTEMPT] }
        executionBinding: { $ref: '#/components/schemas/WorkerSessionBinding', nullable: true }
        schemaVersion:
          type: string
        title:
          type: string
          nullable: true
        workspaceAlias:
          type: string
          nullable: true
          description: Omit for an ordinary workspace-free read-only chat; required for implementation sessions.
        interactionMode:
          type: string
          nullable: true
        intent:
          type: string
          nullable: true
          enum: [ASK, REVIEW, EXPLAIN, DESIGN, IMPLEMENT]
          description: User intent is orthogonal to execution mode; REVIEW is read-only.
        executionMode:
          type: string
          nullable: true
        autonomyLevel:
          type: string
          nullable: true
        permissionMode:
          type: string
          nullable: true
          enum: [WORKSPACE, FULL_ACCESS]
          description: Independent contract override. FULL_ACCESS is not a third interaction mode.
        policyFingerprint:
          type: string
          nullable: true
        preflightRevision:
          type: string
          nullable: true
        workspaceFingerprint:
          type: string
          nullable: true
        writeAllow:
          type: array
          items:
            type: string
          description: Contract directories with edit permission when a workspace is selected; applied on the next turn.
        writeForbid:
          type: array
          items:
            type: string
          description: Contract directories retained as read-only context; applied on the next turn.
        contextDirectories:
          type: array
          items: { type: string, maxLength: 4096 }
          maxItems: 64
          description: User-provided path hints for model context; never a write permission scope.
        directories:
          type: array
          nullable: true
          description: Explicit v2 directory rows. Presence selects directory policy version 2; null is invalid.
          items: { $ref: "#/components/schemas/SessionDirectory" }
        directoryPolicyVersion:
          type: integer
          nullable: true
          enum: [2]
          description: Required with directories on create; v2 is monotonic.
        verificationLevel:
          type: string
          nullable: true
        maxModelTurns:
          type: integer
        maxEditAttempts:
          type: integer
        workspacePolicy:
          $ref: "#/components/schemas/WorkspacePolicy"
          nullable: true
        agentProfileId:
          type: string
          nullable: true
          maxLength: 64
          description: User-selected specialist profile; only valid for workspace-bound sessions.
        agentProfileRevision:
          type: string
          nullable: true
          maxLength: 128
          description: Optional optimistic revision check for the selected profile.
        readonlyResearchMode:
          type: string
          nullable: true
          enum: [AUTO, OFF]
          description: Session-level preference for automatic read-only research delegation.
        initialWorkspaceListing:
          type: boolean
          nullable: true
          description: Whether a workspace-backed session should list the workspace before its first model turn; later turns never repeat this deterministic step.
    SessionPatchRequest:
      type: object
      required: [expectedSessionVersion]
      properties:
        expectedSessionVersion:
          type: integer
          format: int64
        title:
          type: string
          nullable: true
        workspaceAlias:
          type: string
          nullable: true
          description: Empty string removes workspace membership; a valid alias moves the session. Applied on the next turn.
        interactionMode:
          type: string
          nullable: true
        intent:
          type: string
          nullable: true
          enum: [ASK, REVIEW, EXPLAIN, DESIGN, IMPLEMENT]
        permissionMode:
          type: string
          nullable: true
          enum: [WORKSPACE, FULL_ACCESS]
          description: Independent contract override. FULL_ACCESS is not a third interaction mode.
        executionMode:
          type: string
          nullable: true
        autonomyLevel:
          type: string
          nullable: true
        policyFingerprint:
          type: string
          nullable: true
        writeAllow:
          type: array
          items:
            type: string
          description: Contract directories with edit permission. Applied on the next turn.
        writeForbid:
          type: array
          items:
            type: string
          description: Contract directories retained as read-only context. Applied on the next turn.
        contextDirectories:
          type: array
          items: { type: string, maxLength: 4096 }
          maxItems: 64
          description: User-provided path hints for model context; never a write permission scope.
        directories:
          type: array
          nullable: true
          description: Explicit v2 directory rows. Omitted means unchanged; an empty array clears all rows.
          items: { $ref: "#/components/schemas/SessionDirectory" }
        directoryPolicyVersion:
          type: integer
          nullable: true
          enum: [2]
          description: Required when upgrading a v1 session; optional for an existing v2 session.
        replaceLegacyDirectoryPolicy:
          type: boolean
          nullable: true
          description: Required true when the first v2 list replaces legacy write rules.
        verificationLevel:
          type: string
          nullable: true
        extensions:
          $ref: "#/components/schemas/ExtensionSelection"
          description: |
            Session-level extension default (extension design §4.1). A new
            default only affects the next user message; in-flight
            executions keep their frozen binding.
        maxModelTurns:
          type: integer
          nullable: true
        maxEditAttempts:
          type: integer
          nullable: true
        modelAlias:
          type: string
          nullable: true
          description: EW9 session model policy; must reference a configured catalog entry.
        modelSettings:
          $ref: "#/components/schemas/SessionModelSettings"
          nullable: true
