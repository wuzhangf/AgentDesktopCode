      properties:
        schemaVersion: { type: string }
        principalId: { type: string, minLength: 1, maxLength: 128 }
        projectId: { type: string, minLength: 1, maxLength: 128 }
        revision: { type: integer, format: int64, minimum: 1 }
        mode: { type: string, enum: [STANDARD, AUTO_APPROVE, FULL_ACCESS] }
        managedModeCeiling: { type: string, enum: [STANDARD, AUTO_APPROVE, FULL_ACCESS] }
        supportedModes:
          type: array
          minItems: 1
          maxItems: 3
          items: { type: string, enum: [STANDARD, AUTO_APPROVE, FULL_ACCESS] }
        routineDelayMillis: { type: integer, format: int64, minimum: 0, maximum: 86400000 }
        planDelayMillis: { type: integer, format: int64, minimum: 0, maximum: 86400000 }
        budgetDelayMillis:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: integer, format: int64, minimum: 0, maximum: 86400000 }
        maxAutomaticBudgetApprovals: { type: integer, minimum: 0, maximum: 100 }
        approvalTtlMillis: { type: integer, format: int64, minimum: 1000, maximum: 604800000 }
        fullAccessConfirmed: { type: boolean }
        policyFingerprint: { type: string, minLength: 1, maxLength: 128 }
        scopeType: { type: string, enum: [SESSION, PROJECT, USER] }
        scopeId: { type: string, maxLength: 256 }
        requestedMode: { type: string, enum: [STANDARD, AUTO_APPROVE, FULL_ACCESS] }
        effectiveMode: { type: string, enum: [STANDARD, AUTO_APPROVE, FULL_ACCESS] }
        permissionSemanticsVersion:
          type: integer
          minimum: 1
          maximum: 2
          description: "FULL_ACCESS grant semantics generation (1=legacy confirmed, 2=direct grant)."
        approvalBehavior:
          type: string
          enum: [MANUAL, DELAYED, ALLOW_ALL]
          description: "Frontend rendering hint: ALLOW_ALL only while a live FULL_ACCESS grant governs the scope."
        policySource: { type: string, maxLength: 64 }
        grantRevision: { type: integer, format: int64, minimum: 0 }
        grantSource: { type: string, maxLength: 64 }
        grantedAt: { type: string, format: date-time }
        grantActor: { type: string, maxLength: 128 }
        activationStatus:
          type: string
          description: "ACTIVE when the grant is usable; BLOCKED/INACTIVE otherwise."
        blockingReasons:
          type: array
          items: { type: string, maxLength: 128 }
        reconciledPendingApprovals:
          type: integer
          format: int64
          minimum: 0
          description: "Count of pending approvals re-decided by a RECONCILE_SESSION update."
        serverTime: { type: string, format: date-time }
    ExecutionPolicyUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        requestedMode: { type: string, enum: [STANDARD, AUTO_APPROVE, FULL_ACCESS] }
        routineDelayMillis: { type: integer, format: int64, minimum: 0, maximum: 86400000 }
        planDelayMillis: { type: integer, format: int64, minimum: 0, maximum: 86400000 }
        budgetDelayMillis:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: integer, format: int64, minimum: 0, maximum: 86400000 }
        maxAutomaticBudgetApprovals: { type: integer, minimum: 0, maximum: 100 }
        approvalTtlMillis: { type: integer, format: int64, minimum: 1000, maximum: 604800000 }
        acknowledgementVersion: { type: string, maxLength: 64 }
        fullAccessConfirmation: { type: boolean, default: false }
        permissionSemanticsVersion:
          type: integer
          minimum: 1
          maximum: 2
          description: >-
            Grant semantics generation. 2 = selecting FULL_ACCESS is itself
            the grant (no second confirmation); absent keeps the stored
            generation. Legacy semantics-1 updates still require
            fullAccessConfirmation + acknowledgementVersion.
        pendingApprovalAction:
          type: string
          enum: [RETAIN, RECONCILE_SESSION]
          description: >-
            RETAIN keeps existing waiting approvals untouched (default);
            RECONCILE_SESSION re-evaluates this scope's pending approvals
            under the new grant.
        applyToPendingApprovalIds:
          type: array
          maxItems: 100
          items: { type: string, pattern: "^[A-Za-z0-9._-]{1,128}$" }
