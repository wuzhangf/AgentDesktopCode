              $ref: "#/components/schemas/SkillImportRequest"
      responses:
        "201":
          description: Imported skill detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillDetailResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Problem"
