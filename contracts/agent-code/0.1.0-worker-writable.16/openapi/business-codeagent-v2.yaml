    HubConnectionRequest:
      type: object
      required: [displayName, baseUrl]
      description: |
        WU01 (uplift design §5): Hub association registration. The body
        never carries credential material — credentialRef is a slot name
        in the host store. baseUrl is fixed at registration.
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        baseUrl: { type: string, minLength: 1, maxLength: 512 }
        credentialRef:
          type: string
          nullable: true
          maxLength: 128
          description: Credential slot name; never the value.
        scope:
          type: string
          enum: [USER, PROJECT]
          default: USER
        projectId:
          type: string
          nullable: true
          description: Required when scope is PROJECT.
        enabled: { type: boolean, default: true }
        allowInsecureLoopback:
          type: boolean
          default: false
          description: Explicit dev escape — plain HTTP on loopback only.
    HubConnectionUpdateRequest:
      type: object
      required: [expectedRevision]
      description: |
        Association update under CAS. baseUrl is intentionally absent —
        a Hub is never re-pointed in place.
      properties:
        displayName: { type: string, nullable: true, maxLength: 120 }
        credentialRef: { type: string, nullable: true, maxLength: 128 }
        allowInsecureLoopback: { type: boolean, nullable: true }
        enabled: { type: boolean, nullable: true }
        expectedRevision: { type: integer, format: int64 }
    HubConnectionActionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [CONNECT, TEST, DISCONNECT, DIAGNOSE]
    HubConnectionResponse:
      type: object
      description: |
        Public-safe Hub connection view (WU01). credentialConfigured is a
        presence flag for the slot; token material never crosses the wire.
        observed identity fields come from the Hub's own /api/v1/info.
      properties:
        hubConnectionId: { type: string, nullable: true }
        displayName: { type: string, nullable: true }
        baseUrl: { type: string, nullable: true }
        scope: { type: string, nullable: true, enum: [USER, PROJECT, null] }
        projectId: { type: string, nullable: true }
        enabled: { type: boolean, nullable: true }
        revision: { type: integer, format: int64, nullable: true }
        connectionState:
          type: string
          nullable: true
          enum: [STOPPED, CONNECTING, READY, FAILED, DISABLED, null]
        stateReason: { type: string, nullable: true }
        credentialConfigured: { type: boolean, nullable: true }
        insecureLoopback: { type: boolean, nullable: true }
        hubVersion: { type: string, nullable: true }
        apiVersion: { type: string, nullable: true }
        platform: { type: string, nullable: true }
        providerKinds:
          type: array
          nullable: true
          items: { type: string }
        catalogRevision: { type: integer, format: int64, nullable: true }
        lastDiagnosis: { type: string, nullable: true }
        managedServerId: { type: string, nullable: true }
        createdAt: { type: integer, format: int64, nullable: true }
        updatedAt: { type: integer, format: int64, nullable: true }

