      enum:
        - QUEUED
        - RUNNING
        - WAITING_APPROVAL
        - PAUSE_REQUESTED
        - PAUSED
        - CANCEL_REQUESTED
        - VALIDATING
        - NEEDS_ATTENTION
        - COMPLETED
        - FAILED
        - CANCELLED
        - UNKNOWN
    RunStateResponse:
      type: object
      required: [runId, taskId, state, stateVersion]
      properties:
        runId:
          type: string
        taskId:
          type: string
        state:
          $ref: "#/components/schemas/RunState"
        sourceStatus:
          type: string
          nullable: true
          description: Original internal status name, for UNKNOWN drift detection.
        stateVersion:
          type: integer
          format: int64
        lastEventId:
          type: string
          nullable: true
        sessionId:
          type: string
          nullable: true
        workspaceId:
          type: string
          nullable: true
        workspaceAlias:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        failureCode:
          type: string
          nullable: true
        failureMessage:
          type: string
          nullable: true
        terminationCode:
          type: string
          nullable: true
        changedFileCount:
          type: integer
        queuedAt:
          type: string
          nullable: true
        startedAt:
          type: string
          nullable: true
        finishedAt:
          type: string
          nullable: true
        updatedAt:
          type: string
          nullable: true
        outcomeSeverity:
          type: string
          nullable: true
          enum: [OK, WARNING, ERROR]
          description: >-
            Additive V2 (causal verification design 2026-09-02 §11.3):
            outcome severity axis, orthogonal to state. OK/WARNING/ERROR;
            null on legacy runs.
        verificationV2:
          type: object
          nullable: true
          description: >-
            Additive V2 (causal verification design 2026-09-02 §11.3):
            structured verification projection (overall,
            requiredLanesPassed, warnings, lanes). Shape is owned by the
            Product VerificationOutcomeV2 contract; treated as opaque
            here. Null on legacy runs.
          additionalProperties: true
        delivery:
          $ref: "#/components/schemas/RunDeliveryResponse"
          nullable: true
        failure:
          $ref: "#/components/schemas/FailureDescriptorResponse"
          nullable: true
        workspaceConflicts:
          type: array
          description: Direct-workspace CAS conflicts requiring explicit resolution
          items:
            $ref: "#/components/schemas/WorkspaceConflictResponse"
        attention:
          type: object
          nullable: true
          description: >-
            Additive V2 (design 2026-09-25 §6.5): workspace attention
            sub-record {reason, openCount, resolvedCount, dismissedCount,
            clearedAt}; clearedAt != null makes POST /runs/{id}/continue
            admissible.
          additionalProperties: true
        continuationOf:
          type: string
          nullable: true
          description: Run-id this run continues from (WU-05)
        continuedBy:
          type: string
          nullable: true
          description: Run-id of the follow-up created by POST /continue (WU-05)
        scheduling:
          $ref: "#/components/schemas/RunSchedulingResponse"
          nullable: true
        controlState:
          type: string
          nullable: true
          description: Durable run control marker (PAUSE_REQUESTED/RESUME_REQUESTED/STOP_REQUESTED/PAUSED/STOPPED etc.); internal vocabulary, consumers must not treat it as the public state.
        controlCommandId:
          type: string
          nullable: true
          description: Command id of the control currently owning the transition, when present.
        checkpointAvailable:
          type: boolean
          description: Whether a resumable checkpoint is stored for this run.
        availableActions:
          type: array
          items: { type: string }
          description: Control verbs admissible on this state as projected by the server (PAUSE/RESUME/STOP/RECOVER); authoritative admission stays with the commands endpoint.
