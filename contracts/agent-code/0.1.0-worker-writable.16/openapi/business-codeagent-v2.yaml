        "200":
          description: Version list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillVersionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/skills/{skillId}/versions/{versionDigest}/manifest:
    get:
      operationId: getSkillVersionManifest
      summary: |
        File manifest of one immutable version. Paths are package-relative;
