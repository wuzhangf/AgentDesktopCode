              $ref: "#/components/schemas/SkillImportPreviewRequest"
      responses:
        "200":
          description: Import preview with diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillImportPreviewResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/skills/imports:
