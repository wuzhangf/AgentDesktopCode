        never tokens.
      parameters:
        - $ref: "#/components/parameters/ServerId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpAuthActionRequest"
      responses:
        "202":
          description: Auth action accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpAuthActionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/skills/{skillId}:
