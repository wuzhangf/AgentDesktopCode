          type: string
          nullable: true
        finishedAt:
          type: string
          nullable: true
        durationMillis:
          type: integer
          format: int64
          nullable: true
        resultSummary:
          type: string
          nullable: true
        reasonCode:
          type: string
          nullable: true
        failure:
          $ref: "#/components/schemas/FailureDescriptorResponse"
          nullable: true
        truncated:
          type: boolean
          nullable: true
        startCursor:
          type: integer
          format: int64
        endCursor:
          type: integer
          format: int64
        statusOrigin:
          type: string
          nullable: true
          enum: [PERSISTED, DERIVED, null]
        executionId:
          type: string
          nullable: true
          description: >-
            Execution-evidence reference (design 2026-09-26 WU-1): the
            journaled execution id resolvable through
            GET /sessions/{sessionId}/executions/{executionId}. Identifier
            only — this response never carries stdout/stderr or artifact
            bytes. Absent on legacy events or capabilities without evidence.
        commandId:
          type: string
          nullable: true
          description: Command id inside the execution record, when the result names one.
        evidenceState:
          type: string
          nullable: true
          description: Evidence record state reported by the capability (e.g. EXECUTED).
        evidenceArtifacts:
          type: array
          nullable: true
          description: >-
            Record-relative artifact paths (e.g. artifacts/cmd-001.stdout.log)
            fetchable as bounded slices through the session execution
            artifact endpoint.
          items:
            type: string
