          application/json:
            schema:
              $ref: "#/components/schemas/McpPromptResolveRequest"
      responses:
        "200":
          description: Expanded prompt content blocks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpPromptResolveResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/mcp/servers/{serverId}/auth-actions:
    post:
      operationId: requestMcpAuthAction
