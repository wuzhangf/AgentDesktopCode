            $ref: "#/components/schemas/RunStateResponse"
        truncated:
          type: boolean
    RunControlRequest:
      type: object
      additionalProperties: false
      required: [intent]
      properties:
        intent: { type: string, enum: [PAUSE, RESUME, STOP, RECOVER] }
        expectedStateVersion: { type: integer, format: int64, nullable: true }
        reasonCode: { type: string, nullable: true }
    RunCommandRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, commandId, intent]
      description: expectedStateVersion is required for PAUSE and RESUME; STOP accepts a stale version. commandId equals Idempotency-Key.
      properties:
        schemaVersion: { type: string, enum: [run-command/1] }
        commandId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$', maxLength: 128 }
        intent: { type: string, enum: [PAUSE, RESUME, STOP] }
        expectedStateVersion: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, nullable: true }
        reasonCode: { type: string, pattern: '^[A-Z0-9_]+$', maxLength: 128, nullable: true }
    RunCommandReceipt:
      type: object
      additionalProperties: false
      required: [schemaVersion, commandId, receiptId, runId, intent, phase, receiptRevision, acceptedAt, actor, acceptedStateVersion, observedStateVersion, observedRunState, terminal]
      properties:
        schemaVersion: { type: string, enum: [run-command-receipt/1] }
        commandId: { type: string }
        receiptId: { type: string }
        sessionId: { type: string, nullable: true }
        runId: { type: string }
        intent: { type: string, enum: [PAUSE, RESUME, STOP] }
        reasonCode: { type: string, nullable: true }
        phase: { type: string, enum: [ACCEPTED, DISPATCHING, REQUESTED, APPLIED, NOOP, REJECTED, UNKNOWN, SUPERSEDED] }
        receiptRevision: { type: string, pattern: '^[1-9][0-9]*$' }
        acceptedAt: { type: string, format: date-time }
        actor:
          type: object
          additionalProperties: false
          required: [principalId, clientSessionId]
          properties:
            principalId: { type: string }
            clientSessionId: { type: string }
        expectedStateVersion: { type: integer, format: int64, nullable: true }
        acceptedStateVersion: { type: integer, format: int64 }
        observedStateVersion: { type: integer, format: int64 }
        observedRunState: { type: string }
        resultCode: { type: string, nullable: true }
        terminal: { type: boolean }
        evidenceRef: { type: string, nullable: true }
        consumptionProof:
          type: object
          nullable: true
          additionalProperties: { type: string }
    RunCommandPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
