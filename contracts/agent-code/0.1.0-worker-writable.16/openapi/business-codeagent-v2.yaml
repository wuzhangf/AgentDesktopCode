          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: EXT_SCOPE_DENIED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/skills/import-previews:
