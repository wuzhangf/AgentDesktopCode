          application/json:
            schema:
              $ref: "#/components/schemas/ExtensionTestExecutionRequest"
      responses:
        "201":
          description: Test execution created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionTestExecutionResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/executions/{executionId}/extensions:
