        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page of tool descriptors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpToolListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/mcp/servers/{serverId}/catalog-refresh:
    post:
      operationId: refreshMcpServerCatalog
      summary: Explicit catalog refresh; may establish a connection first.
      parameters:
        - $ref: "#/components/parameters/ServerId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Refresh accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpOperationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/mcp/servers/{serverId}/resource-templates:
    get:
      operationId: listMcpResourceTemplates
      summary: M3 — resource templates exposed by the server (profile-gated).
      parameters:
        - $ref: "#/components/parameters/ServerId"
        - name: cursor
          in: query
          schema: { type: string, nullable: true }
      responses:
        "200":
          description: Resource template list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpResourceTemplateListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          description: MCP_PROFILE_UNSUPPORTED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/mcp/servers/{serverId}/prompts:
    get:
      operationId: listMcpPrompts
      summary: M3 — prompts exposed by the server (profile-gated).
      parameters:
        - $ref: "#/components/parameters/ServerId"
        - name: cursor
          in: query
          schema: { type: string, nullable: true }
      responses:
        "200":
          description: Prompt list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpPromptListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          description: MCP_PROFILE_UNSUPPORTED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/mcp/servers/{serverId}/prompts/resolve:
    post:
      operationId: resolveMcpPrompt
      summary: |
        M3 — expand a prompt with user-confirmed arguments. The result is
