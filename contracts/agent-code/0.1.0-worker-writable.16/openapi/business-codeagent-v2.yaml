        lastProgressAt: { type: string, nullable: true }
        executionMode: { type: string, nullable: true }
        workspaceRef: { type: string, nullable: true }
        activeClaims:
          type: array
          items: { type: string }
    SchedulerOverviewResponse:
      type: object
