components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Loopback bearer token; never exposed to the renderer.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ClientSessionId:
      name: clientSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClientSessionToken:
      name: X-CodeAgent-Client-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    BusinessSessionId:
      name: businessSessionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    TerminalSessionId:
      name: terminalSessionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^term_[A-Za-z0-9]{32}$"
    ServerId:
      name: serverId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9_-]{1,64}$"
    SkillId:
      name: skillId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    SkillVersionDigest:
      name: versionDigest
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9:._-]{1,128}$"
    McpOperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    SpecId:
      name: specId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    MissionId:
      name: missionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    WorkspaceLaneId:
      name: workspaceLaneId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    GitOperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    GitCommitId:
      name: commitId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    PublicationId:
      name: publicationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 256
      description: CAS version precondition, for example "sha256:<digest>:<size>"
  responses:
    Problem:
      description: Stable problem document
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Bearer token is required
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    CollaborationEvidenceExportRequest:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - exportId
      properties:
        schemaVersion:
          type: string
          enum:
          - collaboration-evidence-export-request/1
        exportId:
          type: string
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
    CollaborationEvidenceUploadAck:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - exportId
      - digest
      - manifestDigest
      - sizeBytes
      - artifactId
      - receiptRef
      properties:
        schemaVersion:
          type: string
          enum:
          - collaboration-evidence-upload-ack/1
        exportId:
          type: string
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
        digest:
          type: string
          maxLength: 71
          pattern: ^sha256:[0-9a-f]{64}$
        manifestDigest:
          type: string
          maxLength: 71
          pattern: ^sha256:[0-9a-f]{64}$
        sizeBytes:
          type: string
          maxLength: 19
          pattern: ^(0|[1-9][0-9]{0,18})$
        artifactId:
          type: string
          maxLength: 1024
        receiptRef:
          type: string
          maxLength: 1024
    ContextPackageRequest:
      type: object
      additionalProperties: false
      required:
      - requestId
      - snapshotId
      properties:
        schemaVersion:
          type: string
          enum:
          - context-package-request/1
          default: context-package-request/1
        requestId:
          type: string
          maxLength: 128
        profile:
          type: string
          enum:
          - OBSERVE
          - RESEARCH
          default: OBSERVE
        snapshotId:
          type: string
          maxLength: 128
    AuxiliarySessionRequest:
      type: object
      additionalProperties: false
      required:
      - requestId
      - basePackageId
      properties:
        schemaVersion:
          type: string
          enum:
          - auxiliary-session-create/1
          default: auxiliary-session-create/1
        requestId:
          type: string
          maxLength: 128
        purpose:
          type: string
          enum:
          - SIDECAR_QUESTION
          - DELEGATE_READ_ONLY
          default: SIDECAR_QUESTION
        basePackageId:
          type: string
          maxLength: 128
        title:
          type: string
          maxLength: 1000
    AuxiliaryResearchTask:
      type: object
      additionalProperties: false
      required:
      - taskId
      - role
      - question
      properties:
        taskId:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,31}$
        role:
          type: string
          enum:
          - repo-explorer
          - dependency-tracer
          - test-impact-reviewer
          - risk-reviewer
        question:
          type: string
          minLength: 1
          maxLength: 1200
    AuxiliaryTurnRequest:
      type: object
      additionalProperties: false
      required:
      - turnId
      - expectedSessionVersion
      - packageId
      - question
      properties:
        schemaVersion:
          type: string
          enum:
          - auxiliary-turn/1
          default: auxiliary-turn/1
        turnId:
          type: string
          maxLength: 128
        expectedSessionVersion:
          type: string
          pattern: ^[1-9][0-9]{0,15}$
        packageId:
          type: string
          maxLength: 128
        question:
          type: string
          minLength: 1
          maxLength: 8192
        modelAlias:
          type: string
          maxLength: 128
        retryOfTurnId:
          type: string
          maxLength: 128
        textOnlyResearch:
          type: boolean
          default: false
        researchTasks:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/AuxiliaryResearchTask'
    BoundaryInputRequest:
      type: object
      additionalProperties: false
      required:
      - requestId
      - kind
      - expectedExecutionEpoch
      - text
      properties:
        schemaVersion:
          type: string
          enum:
          - run-boundary-request/1
          default: run-boundary-request/1
        requestId:
          type: string
          maxLength: 128
        kind:
          type: string
          enum:
          - REQUEST_REPORT
          - CONTEXT_ADVICE
        expectedExecutionEpoch:
          type: string
          pattern: ^[1-9][0-9]{0,15}$
        text:
          type: string
          minLength: 1
          maxLength: 8192
        sourceRefs:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 512
    AssignmentModelSelection:
      type: object
      additionalProperties: false
      required: []
      properties:
        mode:
          type: string
          enum:
          - KEEP_EFFECTIVE
          - EXPLICIT
          default: KEEP_EFFECTIVE
        settings:
          $ref: '#/components/schemas/SessionModelSettings'
    AssignmentTarget:
      type: object
      additionalProperties: false
      required:
      - agentProfileId
      - agentProfileRevision
      properties:
        harnessId:
          type: string
          enum:
          - product-code
          default: product-code
        agentProfileId:
          type: string
          maxLength: 64
        agentProfileRevision:
          type: string
          maxLength: 128
        modelSelection:
          $ref: '#/components/schemas/AssignmentModelSelection'
    AssignmentTransitionRequest:
      type: object
      additionalProperties: false
      required:
      - target
      properties:
        schemaVersion:
          type: string
          enum:
          - assignment-transition-request/1
          default: assignment-transition-request/1
        transitionId:
          type: string
          maxLength: 128
        expectedRunStateVersion:
          type: string
          pattern: ^[1-9][0-9]{0,15}$
        expectedExecutionEpoch:
          type: string
          pattern: ^[1-9][0-9]{0,15}$
        expectedModelSettingsRevision:
          type: string
          pattern: ^[0-9]{1,16}$
        preflightDigest:
          type: string
          maxLength: 128
        target:
          $ref: '#/components/schemas/AssignmentTarget'
        pendingInputPolicy:
          type: string
          enum:
          - CANCEL_PENDING
          - RETAIN_PENDING
          default: CANCEL_PENDING
    WorkerExecutionWindowRequest:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - runCommandId
      - deadlineEpochMillis
      - executionBinding
      properties:
        schemaVersion:
          type: string
          enum:
          - worker-execution-window/1
        runCommandId:
          type: string
        deadlineEpochMillis:
          type: string
          pattern: ^[1-9][0-9]{0,15}$
        executionBinding:
          $ref: '#/components/schemas/WorkerSessionBinding'
    CollaborationResource:
      type: object
      additionalProperties: true
      properties:
        schemaVersion:
          type: string
        state:
          type: string
        sessionId:
          type: string
        parentSessionId:
          type: string
        runId:
          type: string
        packageId:
          type: string
        digest:
          type: string
        turnId:
          type: string
        jobId:
          type: string
        transitionId:
          type: string
        requestId:
          type: string
        answer:
          type: string
        executionEpoch:
          type: string
        sessionVersion:
          type: string
        preflightDigest:
          type: string
        runStateVersion:
          type: string
        modelSettingsRevision:
          type: string
        reasonCode:
          type: string
          nullable: true
    ClientRegistrationRequest:
      type: object
      additionalProperties: false
      required: [registrationKey, clientId, processInstanceId, clientKind, protocols]
      properties:
        registrationKey: { type: string, format: uuid }
        clientId: { type: string, format: uuid }
        processInstanceId: { type: string, format: uuid }
        clientKind: { type: string, enum: [ELECTRON, WEB_TAB, CLI, SWING, WORKER, MOBILE] }
        protocols:
          type: array
          minItems: 1
