        failure. Never carries secret material; never performs a model
        call. LOCAL/FILE_COMPAT sources answer honestly with
        sync.state=NOT_APPLICABLE.
      responses:
        "200":
          description: Catalog authority status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCatalogAuthorityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v2/agent-profiles:
    get:
      operationId: listAgentProfiles
      summary: Public-safe user-managed specialist profile catalog
      responses:
        "200":
          description: Specialist profiles and per-file load diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfilesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v2/sources/fetch:
    post:
      operationId: fetchSource
      summary: |
        EW10.2 read-only Web/issue/docs source fetch through the Java Host
        adapter. Content is untrusted data by definition; the endpoint is
        gated by the readOnlySources capability flag and bounded by hard
        scheme/host/size/timeout/redirect limits on the service side.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceFetchRequest"
      responses:
        "200":
          description: Fetched source with provenance and untrusted-content marker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFetchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/mcp/servers:
    get:
      operationId: listMcpServers
      summary: |
        EW10.3 read-only MCP source: configured servers with health status.
        Public-safe only — commands, arguments and environment entries never
        leave the service. Gated by the mcpReadOnlySource capability flag.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [USER, PROJECT, OPERATOR], nullable: true }
        - name: projectId
          in: query
          schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,128}$" }
        - name: view
          in: query
          description: |
            SUMMARY returns the legacy McpServerSummary projection; DETAIL
            returns McpServerDetailResponse rows (extension design §9.1).
          schema: { type: string, enum: [SUMMARY, DETAIL], default: SUMMARY }
      responses:
        "200":
          description: MCP server summaries
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/McpServerSummary"
                  - type: array
                    items:
                      $ref: "#/components/schemas/McpServerDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Problem"
    post:
      operationId: registerMcpServer
      summary: |
        Register an MCP server configuration (extension design §5.1). The
        request never carries credential material — secrets are referenced
        by credentialRef slot only. Starting a process is a separate,
        separately authorized connection action.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpServerConfigRequest"
      responses:
        "201":
          description: Registered server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServerDetailResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/mcp/servers/{serverId}/resources:
    get:
      operationId: listMcpResources
      summary: List resources exposed by one configured MCP server (read-only).
      parameters:
        - $ref: "#/components/parameters/ServerId"
      responses:
        "200":
          description: Resource descriptors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/McpResourceDescriptor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/mcp/servers/{serverId}/resources/read:
    post:
      operationId: readMcpResource
      summary: |
        Read one MCP resource through the Java Host adapter. Content is
        untrusted data by definition (design 10.6); never system authority
        and never written to the durable journal.
      parameters:
        - $ref: "#/components/parameters/ServerId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpResourceReadRequest"
      responses:
        "200":
          description: Resource content with provenance and untrusted marker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpResourceReadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/skills:
    get:
      operationId: listSkills
      summary: |
        EW10.5 skill catalog. Instructions are visible by design; the catalog
        never executes anything. Gated by the skillsCatalog capability flag.
        view=SUMMARY (extension design §9.1) returns the lightweight
        projection without instruction bodies for large catalogs.
      parameters:
        - name: view
          in: query
          schema: { type: string, enum: [FULL, SUMMARY], default: FULL }
        - name: scope
          in: query
          schema: { type: string, enum: [PROJECT, USER], nullable: true }
      responses:
        "200":
          description: Skill records (FULL) or lightweight summaries (SUMMARY)
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/SkillRecordResponse"
                  - type: array
                    items:
                      $ref: "#/components/schemas/SkillSummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Problem"
    post:
      operationId: registerSkill
      summary: Register a versioned, source-attributed skill.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillRegisterRequest"
      responses:
        "201":
          description: Registered skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillRecordResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/skills/{skillId}/status:
    post:
      operationId: changeSkillStatus
      summary: Enable, disable or revoke a skill with optimistic concurrency.
      parameters:
        - $ref: "#/components/parameters/SkillId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillStatusRequest"
      responses:
        "200":
          description: Updated skill record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillRecordResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/mcp/servers/{serverId}:
    get:
      operationId: getMcpServer
      summary: Public-safe server detail; credentialRef is a slot name, never material.
      parameters:
        - $ref: "#/components/parameters/ServerId"
      responses:
        "200":
          description: Server detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServerDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMcpServer
      summary: |
        Update mutable configuration fields. Changing executable/args/cwd/
        envRefs/endpoint/credentialRef increments configRevision and
        invalidates cached catalogs and launch approvals.
      parameters:
        - $ref: "#/components/parameters/ServerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpServerUpdateRequest"
      responses:
        "200":
          description: Updated server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServerDetailResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: EXT_REVISION_CONFLICT
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/mcp/servers/{serverId}/status:
    post:
      operationId: setMcpServerStatus
      summary: Enable or disable a server atomically with its config revision.
      parameters:
        - $ref: "#/components/parameters/ServerId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpServerStatusRequest"
      responses:
        "200":
          description: Updated server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServerDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/mcp/servers/{serverId}/connection-actions:
    post:
      operationId: requestMcpConnectionAction
      summary: |
        CONNECT/TEST/DISCONNECT/RESTART lifecycle actions. Actions are
        asynchronous; poll the returned operationId. Launching a process
