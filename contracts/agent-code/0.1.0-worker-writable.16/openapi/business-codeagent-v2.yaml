    NativeOpenIntent:
      type: object
      required: [intentId, projectId, action, root, serviceInstanceId, expiresAtMillis, signature]
      properties:
        intentId:
          type: string
        projectId:
          type: string
        action:
          type: string
          enum: [REVEAL, IDE, USER_TERMINAL, REVEAL_FILE]
        root:
          type: string
        fileRef:
          type: string
          nullable: true
          description: Server-owned file path (REVEAL_FILE only).
        serviceInstanceId:
          type: string
        expiresAtMillis:
          type: integer
          format: int64
        signature:
          type: string
    RunState:
      type: string
