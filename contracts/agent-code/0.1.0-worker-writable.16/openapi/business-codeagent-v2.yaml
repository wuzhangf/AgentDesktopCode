        recoveryBarrier: { type: string, nullable: true }
        provenanceFingerprint: { type: string, nullable: true }
        configFingerprint: { type: string, nullable: true }
        activeRuns: { type: integer, format: int32 }
        maxActiveRuns: { type: integer, format: int32 }
        queuedRuns: { type: integer, format: int32 }
        resourcePools:
          type: array
          items:
            type: object
            additionalProperties: true
    FailureDescriptorResponse:
      type: object
      required: [schemaVersion, code, domain, phase, disposition, effectState, recovery]
      properties:
        schemaVersion: { type: string }
        code: { type: string }
        domain:
          type: string
          enum: [MODEL_AUTH, MODEL_RATE_LIMIT, MODEL_TRANSPORT, MODEL_PROTOCOL, CONTEXT, TOOL_INPUT, TOOL_EXECUTION, WORKSPACE_SCOPE, PERMISSION, BUDGET, VERIFICATION, SERVICE_TRANSPORT, CLIENT_PROTOCOL, ENVIRONMENT, INTERNAL]
        phase:
          type: string
          enum: [ADMISSION, PREPARE, REQUEST, RECEIVE, VALIDATE, EXECUTE, VERIFY, PERSIST, PROJECT, DELIVER]
        disposition:
          type: string
          enum: [AUTO_RECOVERING, USER_ACTION_REQUIRED, OPERATOR_ACTION_REQUIRED, TERMINAL]
        effectState:
          type: string
          enum: [NOT_APPLIED, APPLIED, UNKNOWN]
        safeMessage: { type: string, nullable: true, maxLength: 2000 }
