        mode:
          type: string
          enum: [NONE, MODEL_REPAIR_INPUT, NEW_MODEL_ATTEMPT, RESUME_CHECKPOINT, RETRY_OPERATION, RECONCILE_THEN_RETRY]
        actor:
          type: string
          enum: [RUNTIME, MODEL, USER, OPERATOR]
        automatic: { type: boolean }
        sameInputAllowed: { type: boolean }
        attemptsUsed: { type: integer, format: int32, minimum: 0 }
        maxAttempts: { type: integer, format: int32, minimum: 0 }
