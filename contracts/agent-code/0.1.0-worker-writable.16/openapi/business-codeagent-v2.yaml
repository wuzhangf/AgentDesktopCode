        "200":
          description: Version manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillManifestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
