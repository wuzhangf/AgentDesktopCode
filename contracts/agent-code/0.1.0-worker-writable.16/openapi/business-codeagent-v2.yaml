          type: string
          nullable: true
        resolvedAt:
          type: string
          nullable: true
    Problem:
      type: object
      description: |
        Actual wire shape of v2 problems: {code, status, message} plus
        flattened detail fields. The `code` is the only stable contract for
        UIs; `message` is human-readable diagnostics.
      required: [code, status, message]
      properties:
        code:
          type: string
        status:
          type: integer
        message:
          type: string
        failure:
          $ref: "#/components/schemas/FailureDescriptorResponse"
          nullable: true
      additionalProperties: true
    ExecutionBackendStatusResponse:
      type: object
      required: [snapshotVersion, snapshotId, generation, backends]
      properties:
        snapshotVersion: { type: string }
        snapshotId: { type: string }
        catalogFingerprint: { type: string, nullable: true }
        generation: { type: integer, format: int64, minimum: 0 }
        observedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        reasonCode: { type: string, nullable: true }
        safeReason: { type: string, nullable: true }
        backends:
          type: array
          items:
            type: object
            required: [id, type, availability, isolationLevel]
            properties:
              id: { type: string }
              type: { type: string }
              availability: { type: string }
              isolationLevel: { type: string }
              reasonCode: { type: string, nullable: true }
              safeReason: { type: string, nullable: true }
    CapabilityResponse:
      type: object
      required: [serviceInstanceId, protocolVersion, minDesktopProtocol, features, limits, operations]
      properties:
        serviceInstanceId:
          type: string
        storeId:
          type: string
          nullable: true
          description: Stable identity of the service state store; changes only when the store is replaced.
        bootId:
          type: string
          nullable: true
          description: Process boot identity; changes on every Service restart.
        protocolVersion:
          type: string
          example: "2.1"
        minDesktopProtocol:
          type: string
          example: "2.0"
        build:
          type: object
          properties:
            business:
              type: string
              nullable: true
            productCode:
              type: string
              nullable: true
            productPlan:
              type: string
              nullable: true
            framework:
              type: string
              nullable: true
            foundation:
              type: string
              nullable: true
        features:
          type: object
          properties:
            sessionV2:
              type: boolean
            durableEvents:
              type: boolean
            visibleOutputStream:
              type: boolean
            reviewScopes:
              type: array
              items:
                type: string
                enum: [LAST_TURN, RUN, WORKING_TREE, STAGED, COMMIT, BRANCH]
            worktreeExecution:
              type: boolean
            mission:
              type: boolean
            readOnlySources:
              type: boolean
              description: |
                EW10.2 read-only Web/issue/docs source adapter (design 10.9).
                Off by default; enabling requires the source threat-model
                gates. Fetched content is always untrusted data.
            mcpReadOnlySource:
              type: boolean
              description: |
                EW10.3 read-only MCP resource source (design 10.6). Off by
                default; servers come from the service-side allowlist only,
                resources/list and resources/read only, content is always
                untrusted data. Mutating MCP tools stay behind mcpHost.
            skillsCatalog:
              type: boolean
              description: |
                EW10.5 skill catalog (design 10.6). Off by default; the
                catalog only registers, lists and gates skills — it never
                executes them.
            hooks:
              type: boolean
              description: |
                EW10.6 typed hooks (design 10.6). Off by default; hooks are
                operator-allowlisted lifecycle observers with fixed events,
                typed input, timeouts and a never-blocks-the-run failure
                policy. No arbitrary implicit shell.
            readOnlySubagent:
              type: boolean
              description: |
                Read-only research/plan subagent capability. Off by default;
                enabling requires the EW8 subagent contract gates.
            readOnlySubagentAvailability:
              type: string
              enum: [NONE, WORKSPACE_ALLOWLIST, ALL_ELIGIBLE_WORKSPACES]
              description: |
                Service-level rollout shape for the read-only research
                capability. Session/workspace eligibility is evaluated per run.
            mcpHost:
              type: boolean
            servicePty:
              type: boolean
            repositoryBinding:
              type: boolean
              description: Cloud Git workspace (detailed design §10.5). Off by default.
            managedClone:
              type: boolean
            remoteWorkspaceLane:
              type: boolean
            remoteFileWrite:
              type: boolean
            gitLocalCommit:
              type: boolean
            gitRemotePush:
              type: boolean
            pullRequestCreate:
              type: boolean
            signedCommit:
              type: boolean
            multiRepositoryLane:
              type: boolean
            projectEnvironmentPrepareV1:
              type: boolean
              description: |
                PAE P0 joint capability (p0-contract-freeze §2): trusted
                project-environment prepare is available only when the
                install-side Operator channel, real bound-environment
                consumption and measured readiness are all in place.
                Absent/false means unsupported — no silent host fallback.
            environmentBoundExecutionV1:
              type: boolean
              description: |
                PAE P0 joint capability (p0-contract-freeze §2):
                executions run inside a frozen execution-environment
                binding end to end. Same joint advertisement and no
                fallback rules as projectEnvironmentPrepareV1.
            adaptiveActionV1:
              type: boolean
              description: |
                PAE P0 joint capability (p0-contract-freeze §2): TASK/
                PROJECT adaptive action plans and trial receipts.
                Same joint advertisement and no fallback rules as
                projectEnvironmentPrepareV1.
        limits:
          type: object
          properties:
            maxDiffBytes:
              type: integer
              format: int64
            maxEventPage:
              type: integer
            maxVisibleDeltaChars:
              type: integer
        multiClient:
          type: object
          nullable: true
          properties:
            contractVersion:
              type: string
            mode:
              type: string
              enum: [SHARED_STRICT, LEGACY_COMPAT, OWNED_PRIVATE]
            lifecycle:
              type: string
            registrationRequiredForMutation:
              type: boolean
            limits:
              type: object
              additionalProperties: true
        operations:
          type: array
          description: Operation-level availability generated from the wired service routes.
          items:
            $ref: "#/components/schemas/OperationCapability"
    OperationCapability:
      type: object
      required: [id, availability, contractVersion]
      properties:
        id:
