          description: Number of model responses contributing to the in-memory usage projection.
        contextTokenOptions:
          type: array
          description: Selectable context budgets declared by the model; clients must not submit arbitrary token values.
          items:
            type: integer
            format: int32
        reasoningEffortOptions:
          type: array
          items:
            type: string
        configured:
          type: boolean
        routePolicyName:
          type: string
          nullable: true
        availability:
          type: string
          enum: [AVAILABLE, UNCONFIGURED, UNAVAILABLE]
    ModelCatalogResponse:
      type: object
      required: [items]
      properties:
        defaultModel:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelCatalogEntry"
    ModelCatalogAuthorityResponse:
      type: object
      description: |
        MA-001 MA04 authority snapshot. Secret-free by construction.
      required: [source, applied, sync]
      properties:
        source:
          type: string
          enum: [LOCAL, ENTERPRISE_HTTP, FILE_COMPAT, UNKNOWN]
        sourceIdentity:
          type: string
          nullable: true
          description: Secret-free source label, e.g. mrel-...@41.
        capabilities:
          type: object
          properties:
            managedCatalogWrite: { type: boolean }
            enterpriseSync: { type: boolean }
        applied:
          type: object
          properties:
            releaseId: { type: string, nullable: true }
            generation: { type: integer, format: int64, nullable: true }
            authorityId: { type: string, nullable: true }
            profileId: { type: string, nullable: true }
            consumerSnapshotDigest: { type: string, nullable: true }
            projectionFingerprint: { type: string, nullable: true }
            loadedAt: { type: string, nullable: true }
            readiness: { type: string, nullable: true }
            catalogError: { type: string, nullable: true }
        sync:
          type: object
          description: |
            Enterprise poll posture; state=NOT_APPLICABLE for
            non-enterprise sources. revocationChannel honestly states
            what the negotiated wire version can express:
            CONSUMER_V2 (binding ids + validity horizons) or
            RELEASE_WITHDRAWAL_ONLY (v1 head).
          properties:
            enabled: { type: boolean }
            state:
              type: string
              enum: [OPEN, CLOSED, STOPPED, NOT_APPLICABLE]
            running: { type: boolean }
            pollMillis: { type: integer, format: int64 }
            jitterMillis: { type: integer, format: int64 }
            polls: { type: integer, format: int64 }
            syncSuccesses: { type: integer, format: int64 }
            syncFailures: { type: integer, format: int64 }
            applies: { type: integer, format: int64 }
            desired:
              type: object
              properties:
                releaseId: { type: string, nullable: true }
                generation:
                  type: integer
                  format: int64
                  nullable: true
                projectionFingerprint:
                  type: string
                  nullable: true
                scopeDigest: { type: string, nullable: true }
                validUntil:
                  type: string
                  format: date-time
                  nullable: true
            negotiatedSchemaVersion:
              type: integer
              nullable: true
            revocationChannel:
              type: string
              enum: [CONSUMER_V2, RELEASE_WITHDRAWAL_ONLY, NONE]
            lastSuccessAt:
              type: string
              format: date-time
              nullable: true
            lastAttemptAt:
              type: string
              format: date-time
              nullable: true
            lastSuccessMonotonicMillis:
              type: integer
              format: int64
              nullable: true
            freshnessMillis: { type: integer, format: int64 }
            freshnessRemainingMillis:
              type: integer
              format: int64
              nullable: true
            consumerDeauthorized: { type: boolean }
            authorizationExpired: { type: boolean }
            authorizationExpiresAt:
              type: string
              format: date-time
              nullable: true
            trackedReleases: { type: integer }
            lastError:
              type: object
              properties:
                code: { type: string, nullable: true }
                kind: { type: string, nullable: true }
                detail: { type: string, nullable: true }
                at:
                  type: string
                  format: date-time
                  nullable: true
            report:
              type: object
              properties:
                status:
                  type: string
                  enum: [APPLIED, REPORT_PENDING, NONE]
                pendingAttempts: { type: integer, format: int64 }
            credentialEnvRequiresRestart: { type: boolean }
