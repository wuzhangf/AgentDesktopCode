          type: string
          enum: [REQUESTED, SUCCEEDED, FAILED, PARTIAL, UNKNOWN]
    RunActivityResponse:
      type: object
      required: [activityId, runId, kind, status]
      properties:
        activityContractVersion:
          type: integer
          format: int32
          nullable: true
        activitySequence:
          type: integer
          format: int64
          nullable: true
        activityId:
          type: string
        runId:
          type: string
        attempt:
          type: integer
          format: int32
          nullable: true
          description: Child attempt number used for replay-safe delegation status.
        outcomeVersion:
          type: integer
          format: int64
          nullable: true
          description: Event timestamp/version of the authoritative child outcome.
        roundId:
          type: string
          nullable: true
          description: >-
            Model-interaction round key (design 2026-09-19 §5.1): the Product
            logical model-call id shared by every product of one call.
            Absent on legacy or runtime-owned items; never inferred.
        roundOrdinal:
          type: integer
          format: int32
          nullable: true
          description: Optional 1-based round order inside the run.
        kind:
          type: string
          description: Stable activity kind (FILE_READ, CODE_SEARCH, COMMAND, BUILD, GIT, ...).
        status:
          type: string
          description: RUNNING / SUCCEEDED / PARTIAL / FAILED / TIMED_OUT / REJECTED / CANCELLED / WAITING_APPROVAL / ABORTED / UNKNOWN.
        toolName:
          type: string
          nullable: true
        capabilityId:
          type: string
          nullable: true
        detail:
          type: string
          nullable: true
        commandPreview:
          type: string
          nullable: true
          description: Redacted, bounded command preview; never raw arguments.
        redactionState:
          type: string
          enum: [NONE, REDACTED, WITHHELD]
        targets:
          type: array
          items:
            $ref: "#/components/schemas/RunActivityTargetResponse"
