        messages:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              clientMessageId:
                type: string
                nullable: true
              role:
                type: string
              content:
                type: string
              status:
                type: string
                nullable: true
              taskId:
                type: string
                nullable: true
              runId:
                type: string
                nullable: true
              reasoning:
                type: string
                nullable: true
