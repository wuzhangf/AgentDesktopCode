          required: false
          schema:
            $ref: "#/components/schemas/TerminalOutputMode"
      responses:
        "200":
          description: Bounded output page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalOutputResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "410":
          $ref: "#/components/responses/Problem"
  /api/v2/terminal-sessions/{terminalSessionId}/output/live:
    get:
      operationId: streamTerminalOutput
      summary: Stream terminal output as SSE
      parameters:
        - $ref: "#/components/parameters/TerminalSessionId"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
        - name: maxBytes
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 262144
            default: 16384
        - name: waitMillis
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 30000
            default: 30000
      responses:
        "200":
          description: Terminal output event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v2/terminal-sessions/{terminalSessionId}/input:
    post:
      operationId: writeTerminalInput
      summary: Write user-controlled input to a terminal session
      parameters:
        - $ref: "#/components/parameters/TerminalSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalInputRequest"
      responses:
        "202":
          description: Input delivery result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalInputResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/terminal-sessions/{terminalSessionId}/resize:
    post:
      operationId: resizeTerminalSession
      summary: Resize a terminal session using latest-wins sequencing
      parameters:
        - $ref: "#/components/parameters/TerminalSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalResizeRequest"
      responses:
        "200":
          description: Applied terminal size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalResizeResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v2/terminal-sessions/{terminalSessionId}/signals:
    post:
      operationId: signalTerminalSession
      summary: Send a governed interrupt or terminate signal
      parameters:
        - $ref: "#/components/parameters/TerminalSessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalSignalRequest"
      responses:
        "200":
          description: Signal delivery result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalSignalResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v2/projects:
    get:
      operationId: listProjects
      summary: Registered projects visible to this service
      responses:
        "200":
          description: Project summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v2/projects/registrations:
    post:
      operationId: registerProject
      summary: |
        Register a local project from an absolute path. High-risk local
        entry: only the Electron main may call it; the service canonicalizes
        the path, requires an existing directory and rejects symlinks. Git is
        optional: Git-backed projects expose VCS features, while ordinary
        directories remain usable for workspace read/write operations.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRegistrationRequest"
      responses:
        "201":
          description: Registration result (canonicalRoot is only for the caller)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRegistrationResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v2/projects/{projectId}:
    get:
      operationId: getProject
      summary: Project summary
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v2/projects/{projectId}/status:
    get:
      operationId: getProjectStatus
      summary: Detailed project status (workspace identity, dirty state)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v2/projects/{projectId}/session-preflight:
    get:
      operationId: getProjectSessionPreflight
      summary: Resolve the server-owned inputs for creating a session
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Session creation preflight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSessionPreflight"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v2/projects/{projectId}/build-plan:
    get:
      operationId: getProjectBuildPlan
      summary: >-
        Resolved build plan per detected target (design 2026-09-26 §7.2) —
        recipe-driven argv dry run, readiness facts, effective overrides.
        Never spawns a process.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Resolved build plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectBuildPlanResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v2/projects/{projectId}/build-plan/overrides:
    put:
      operationId: putProjectBuildPlanOverride
      summary: >-
        Validate and persist a user build-plan override (runner / argv /
        env / disabled). Rows bind the live workspace fingerprint and turn
        STALE on drift.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildPlanOverrideRequest"
      responses:
        "200":
          description: Persisted override plus the re-resolved target view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildPlanOverrideResponse"
        "400":
          description: INVALID_REQUEST — element-level validation failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: TARGET_NOT_FOUND or PROJECT_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v2/projects/{projectId}/build-plan/preview:
    post:
      operationId: previewProjectBuildPlan
      summary: >-
        Render a candidate override's resolved plan without persisting —
        identical validation and resolver semantics as PUT.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildPlanOverrideRequest"
      responses:
        "200":
          description: Candidate override plus the resolved target view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildPlanPreviewResponse"
        "400":
          description: INVALID_REQUEST — element-level validation failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: TARGET_NOT_FOUND or PROJECT_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v2/projects/{projectId}/verification-profiles:
    get:
      operationId: listVerificationProfiles
      summary: >-
        List the project's persisted verification profiles (design
        2026-09-26 §7.4/§10.2). Each profile carries its optimistic
        revision and the configDigest that plan fingerprints bind to.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Persisted verification profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationProfileListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: FEATURE_DISABLED — profile service not enabled
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v2/projects/{projectId}/verification-profiles/{profileId}:
    get:
      operationId: getVerificationProfile
      summary: Read one verification profile
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The persisted profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: NOT_FOUND — no such profile
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      operationId: putVerificationProfile
      summary: >-
        Create or update a verification profile under optimistic
        control. If-Match carries the client's known revision (a bare
        number or quoted etag); a create omits it and fails when the
        profile already exists.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: profileId
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: Expected stored revision for the update.
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationProfileRequest"
      responses:
        "200":
          description: The persisted profile with its new revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationProfileResponse"
        "400":
          description: INVALID_REQUEST — malformed profileId or config
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: REVISION_CONFLICT — the stored revision moved
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v2/projects/{projectId}/files/{fileRef}:
    get:
      operationId: readProjectFile
      summary: Read bounded UTF-8 content from a server-authorized workspace file
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: fileRef
          in: path
          required: true
          schema:
            type: string
          description: Workspace-relative file reference; path traversal and symlinks are rejected.
        - name: revision
          in: query
          required: false
          schema:
            type: string
          description: Current workspace snapshot fingerprint, or current.
      responses:
        "200":
          description: Bounded file projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileReadResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v2/projects/{projectId}/native-open-intents:
    post:
      operationId: createNativeOpenIntent
      summary: |
        Mint a short-lived signed intent (REVEAL | IDE | USER_TERMINAL |
        REVEAL_FILE) for the Electron main to open a native shell for the
        project. The intent expires in 30 seconds and never carries an
        arbitrary executable.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [REVEAL, IDE, USER_TERMINAL, REVEAL_FILE]
                fileRef:
                  type: string
                  nullable: true
                  description: |
                    Server-owned file reference (validated against the run's
                    changedFiles); required for REVEAL_FILE, rejected otherwise.
      responses:
        "201":
          description: Signed intent (returned only to the authenticated main)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativeOpenIntent"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v2/runs:
    get:
      operationId: listRuns
      summary: Run list for the Task Center
      parameters:
        - name: sessionId
          in: query
          schema:
            type: string
        - name: workspaceAlias
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Paged run list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v2/scheduler/overview:
    get:
      operationId: getSchedulerOverview
      summary: Scheduler capacity, recovery barrier, and resource-pool projection
      responses:
        "200":
          description: Scheduler overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulerOverviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v2/runs/{runId}:
    get:
      operationId: getRun
      summary: Authoritative run view; terminal state is only taken from here
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v2/runs/{runId}/scheduling:
    get:
      operationId: getRunScheduling
      summary: Authoritative scheduling projection for one run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run scheduling state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSchedulingResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v2/runs/{runId}/commands:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/ClientSessionToken"
    post:
      operationId: submitRunCommand
      summary: Persist a lifecycle intent; acceptance does not confirm execution
      description: Requires session.foundation.enabled. Replays the same command before checking the current Run version.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunCommandRequest" }
      responses:
        "202":
          description: Accepted intent, including an unresolved UNKNOWN dispatch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunCommandReceipt" }
        "200":
          description: Terminal receipt or idempotent terminal replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunCommandReceipt" }
        default: { $ref: "#/components/responses/Problem" }
    get:
      operationId: listRunCommands
      summary: Read bounded durable history, newest admission first
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: before, in: query, schema: { type: string }, description: Command ID from nextBefore in this Run }
      responses:
        "200":
          description: Retained command receipts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunCommandPage" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v2/runs/{runId}/commands/{commandId}:
    get:
      operationId: getRunCommand
      summary: Read any retained command, including after disabling new command admission
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/ClientSessionToken"
        - { name: commandId, in: path, required: true, schema: { type: string, maxLength: 128 } }
      responses:
        "200":
          description: Current persistent receipt for this command
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunCommandReceipt" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v2/runs/{runId}/controls:
    post:
      operationId: controlRun
      summary: Legacy lifecycle control with unchanged Run response
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunControlRequest" }
      responses:
        "200":
          description: Request accepted or replayed; inspect Run controlState
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunStateResponse" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v2/runs/{runId}/controls/{controlId}:
    get:
      operationId: getLatestRunControl
      summary: Legacy latest-command lookup; use commands for retained history
      parameters:
        - $ref: "#/components/parameters/RunId"
        - { name: controlId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Run view when controlId is the latest command
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunStateResponse" }
        default: { $ref: "#/components/responses/Problem" }
  /api/v2/runs/{runId}/interrupt:
    post:
      operationId: interruptRun
      summary: Request an interrupt for a running run
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunInterruptRequest"
      responses:
        "200":
          description: Interrupt accepted (or idempotent replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStateResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: STATE_VERSION_CONFLICT or run not interruptable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v2/runs/{runId}/continue:
    post:
      operationId: continueRun
      summary: >-
        Create the linked continuation run once workspace attention is
        cleared (design §6.5).  The original NEEDS_ATTENTION run stays
        terminal; the follow-up run binds the CURRENT_WORKTREE baseline
        with KNOWN_LINEAGE_CONTINUATION auditing and receives a system
        frame naming the resolved/dismissed conflict paths.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunContinueRequest"
      responses:
        "201":
          description: Continuation run created (or idempotent replay of it)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStateResponse"
        "400":
          description: RUN_ATTENTION_NOT_CLEARED or invalid body
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: STATE_VERSION_CONFLICT or RUN_NOT_CONTINUABLE
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v2/runs/{runId}/evidence:
    get:
      operationId: getRunEvidence
      summary: Layered evidence bundle; NOT_RUN layers are never hidden
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Evidence bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceBundleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v2/workspace-executions:
    post:
      operationId: createWorkspaceExecution
      summary: |
        Provision a service-owned workspace execution (EW7). The source
        checkout must be clean; dirty WIP fails closed. The response carries
        a safe workspaceRef, never a filesystem path.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceExecutionCreateRequest"
      responses:
        "201":
          description: Workspace execution provisioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceExecutionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Problem"
    get:
      operationId: listWorkspaceExecutions
      summary: List workspace executions for a project
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,128}$"
      responses:
        "200":
          description: Workspace execution list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceExecutionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v2/workspace-executions/{workspaceExecutionId}:
    get:
      operationId: getWorkspaceExecution
      summary: Read one workspace execution; lease expiry surfaces as leaseExpired
      parameters:
        - name: workspaceExecutionId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,128}$"
      responses:
        "200":
          description: Workspace execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceExecutionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v2/workspace-executions/{workspaceExecutionId}/lease:
    post:
      operationId: renewWorkspaceExecutionLease
      summary: |
        Renew the lease with fencing. A stale leaseId/fencingToken fails
        closed with WORKSPACE_LEASE_LOST.
      parameters:
        - name: workspaceExecutionId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,128}$"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
