      summary: Submit a plan revision for a mission in NEEDS_ATTENTION
      parameters:
        - $ref: "#/components/parameters/MissionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionPlanRequest"
      responses:
        "200":
          description: Replan revision submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/missions/{missionId}/artifacts:
    get:
      operationId: getMissionArtifacts
      summary: Unconsumed artifact refs of a mission
      parameters:
        - $ref: "#/components/parameters/MissionId"
      responses:
        "200":
          description: Mission artifacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionArtifactsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/policies/layers:
    get:
      operationId: listPolicyLayers
      summary: Project/user/managed policy precedence projection
      responses:
        "200":
          description: Policy layers with effective ceiling
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyLayersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v2/policies/{layer}:
    put:
      operationId: updatePolicyLayer
      summary: |
        Update a writable policy layer (PROJECT|USER). A candidate looser
        than its parent fails closed with POLICY_ELEVATION_FORBIDDEN.
      parameters:
        - name: layer
          in: path
          required: true
          schema:
            type: string
            enum: [PROJECT, USER]
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyLayerUpdateRequest"
      responses:
        "200":
          description: Layer updated; revision bumped and policy.updated emitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyLayersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v2/policies/effective:
    get:
      operationId: getEffectiveRiskPolicy
      summary: Effective risk policy for a session
      parameters:
        - name: sessionId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Effective risk policy
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v2/settings:
    get:
      operationId: getProductSettings
      summary: Product settings; defaults are local-only and minimal
      responses:
        "200":
          description: Product settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateProductSettings
      summary: Update settings; bumps revision and emits settings.updated
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductSettingsUpdateRequest"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v2/memory/knowledge:
    get:
      operationId: listKnowledge
      summary: |
        Knowledge items; facts contains only CONFIRMED entries — pending
        suggestions never become facts.
      responses:
        "200":
          description: Knowledge items and confirmed facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: suggestKnowledge
      summary: Record a knowledge suggestion; it stays PENDING until confirmed
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                sourceRef: { type: string, nullable: true }
      responses:
        "201":
          description: Suggestion recorded as PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItemResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v2/memory/knowledge/{knowledgeId}/confirm:
    post:
      operationId: confirmKnowledge
      summary: Confirm a pending suggestion; only then does it become a fact
      parameters:
        - name: knowledgeId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,128}$"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Knowledge confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItemResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v2/runs/{runId}/activities:
    get:
      operationId: getRunActivities
      summary: Recoverable public activity snapshot folded from the durable run event stream
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: afterCursor
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Deterministic activity fold with honest completeness flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunActivityListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v2/runs/{runId}/reasoning:
    get:
      operationId: getRunReasoning
      summary: |
        Recoverable display-reasoning snapshot folded from the run's durable
        run.reasoning.append stream (design 2026-09-18). Carries
        provider-returned public thinking text only — never answer text,
        tool output or continuation state. complete=false with reasonCode
        means the snapshot is a lower bound, never a silent truncation.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Deterministic reasoning fold with honest completeness flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunReasoningResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v2/runs/{runId}/output:
    get:
      operationId: getRunOutput
      summary: |
        Recoverable visible-output snapshot folded from the run's durable
        run.output.append stream (design 2026-09-19 §5.5-B). Carries
        provider-returned public-safe output text only — never reasoning,
        tool output or continuation state. complete=false with reasonCode
        means the snapshot is a lower bound, never a silent truncation.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Deterministic output fold with honest completeness flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunOutputResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v2/runs/{runId}/diff:
    get:
      operationId: getRunDiff
      summary: |
        Paged run diff against the workspace baseline. Bounds via
        page/pageSize; stale when computed against an older stateVersion.
        Services without a persisted change artifact return a typed Problem;
        clients must fail closed and must not fabricate diff rows.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paged diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffPageResponse"
        "501":
          description: Legacy service does not expose the diff projection
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v2/runs/{runId}/workspace-conflicts:
    get:
      operationId: listRunWorkspaceConflicts
      summary: List direct-workspace CAS conflicts for a run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Conflict list with current file versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceConflictListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v2/workspace-conflicts/{conflictId}:
    get:
      operationId: getWorkspaceConflict
      summary: Get one direct-workspace conflict
      parameters:
        - name: conflictId
          in: path
          required: true
          schema:
            type: string
            pattern: "^wc-[A-Za-z0-9_-]{12,64}$"
      responses:
        "200":
          description: Conflict details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceConflictResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v2/workspace-conflicts/{conflictId}/resolve:
    post:
      operationId: resolveWorkspaceConflict
      summary: Resolve one direct-workspace conflict with optimistic concurrency
      parameters:
        - name: conflictId
          in: path
          required: true
          schema:
            type: string
            pattern: "^wc-[A-Za-z0-9_-]{12,64}$"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceConflictResolveRequest"
      responses:
        "200":
          description: Conflict resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceConflictResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Conflict state or file version changed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v2/runs/{runId}/review:
    get:
      operationId: getRunReview
      summary: Read-only review projection with findings (empty when none)
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Review projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRunResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v2/findings/{findingId}/fix-task:
    post:
      operationId: createFixTask
      summary: |
        Turn a finding into a fix task; the finding id is preserved in the
        task lineage so fixes stay traceable to their review.
      parameters:
        - name: findingId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,128}$"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceAlias, goal]
              properties:
                workspaceAlias:
                  type: string
                goal:
                  type: string
      responses:
        "201":
          description: Fix task created with finding lineage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FixTaskResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v2/model-catalog:
    get:
      operationId: getModelCatalog
      summary: Public-safe model catalog; never includes credential material
      responses:
        "200":
          description: Model catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCatalogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v2/agent-profiles:
    get:
      operationId: listAgentProfiles
      summary: Public-safe user-managed specialist profile catalog
      responses:
        "200":
          description: Specialist profiles and per-file load diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProfilesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v2/sources/fetch:
    post:
      operationId: fetchSource
      summary: |
        EW10.2 read-only Web/issue/docs source fetch through the Java Host
        adapter. Content is untrusted data by definition; the endpoint is
        gated by the readOnlySources capability flag and bounded by hard
        scheme/host/size/timeout/redirect limits on the service side.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceFetchRequest"
      responses:
        "200":
          description: Fetched source with provenance and untrusted-content marker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFetchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/mcp/servers:
    get:
      operationId: listMcpServers
      summary: |
        EW10.3 read-only MCP source: configured servers with health status.
        Public-safe only — commands, arguments and environment entries never
        leave the service. Gated by the mcpReadOnlySource capability flag.
      responses:
        "200":
          description: MCP server summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/McpServerSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/mcp/servers/{serverId}/resources:
    get:
      operationId: listMcpResources
      summary: List resources exposed by one configured MCP server (read-only).
      parameters:
        - $ref: "#/components/parameters/ServerId"
      responses:
        "200":
          description: Resource descriptors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/McpResourceDescriptor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/mcp/servers/{serverId}/resources/read:
    post:
      operationId: readMcpResource
      summary: |
        Read one MCP resource through the Java Host adapter. Content is
        untrusted data by definition (design 10.6); never system authority
        and never written to the durable journal.
      parameters:
        - $ref: "#/components/parameters/ServerId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpResourceReadRequest"
      responses:
        "200":
          description: Resource content with provenance and untrusted marker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpResourceReadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/skills:
    get:
      operationId: listSkills
      summary: |
        EW10.5 skill catalog. Instructions are visible by design; the catalog
        never executes anything. Gated by the skillsCatalog capability flag.
      responses:
        "200":
          description: Skill records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillRecordResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Problem"
    post:
      operationId: registerSkill
      summary: Register a versioned, source-attributed skill.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillRegisterRequest"
      responses:
        "201":
          description: Registered skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillRecordResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/skills/{skillId}/status:
    post:
      operationId: changeSkillStatus
      summary: Enable, disable or revoke a skill with optimistic concurrency.
      parameters:
        - $ref: "#/components/parameters/SkillId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillStatusRequest"
      responses:
        "200":
          description: Updated skill record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillRecordResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/hooks:
    get:
      operationId: listHooks
      summary: |
        EW10.6 typed hooks: operator-allowlisted lifecycle observers with
        health status. Command material never leaves the service. Gated by
        the hooks capability flag.
      responses:
        "200":
          description: Hook summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HookSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/hooks/executions:
    get:
      operationId: listHookExecutions
      summary: Bounded recent hook executions (status and duration only).
      responses:
        "200":
          description: Recent execution records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookExecutionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Loopback bearer token; never exposed to the renderer.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ClientSessionId:
      name: clientSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClientSessionToken:
      name: X-CodeAgent-Client-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    BusinessSessionId:
      name: businessSessionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    TerminalSessionId:
      name: terminalSessionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^term_[A-Za-z0-9]{32}$"
    ServerId:
      name: serverId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9_-]{1,64}$"
    SkillId:
      name: skillId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    SpecId:
      name: specId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    MissionId:
      name: missionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    WorkspaceLaneId:
      name: workspaceLaneId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
  responses:
    Problem:
      description: Stable problem document
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Bearer token is required
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ClientRegistrationRequest:
      type: object
      additionalProperties: false
      required: [registrationKey, clientId, processInstanceId, clientKind, protocols]
      properties:
        registrationKey: { type: string, format: uuid }
        clientId: { type: string, format: uuid }
        processInstanceId: { type: string, format: uuid }
        clientKind: { type: string, enum: [ELECTRON, WEB_TAB, CLI, SWING] }
        protocols:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        displayLabel: { type: string, maxLength: 64 }
    ClientSessionResponse:
      type: object
      additionalProperties: false
      required: [clientSessionId, clientSessionToken, storeId, bootId, ttlMillis, remainingTtlMillis, acceptedProtocols]
      properties:
        clientSessionId: { type: string, format: uuid }
        clientSessionToken: { type: string, minLength: 64, maxLength: 256, writeOnly: true }
        storeId: { type: string }
        bootId: { type: string, format: uuid }
        ttlMillis: { type: integer, format: int64, minimum: 1 }
        remainingTtlMillis: { type: integer, format: int64, minimum: 0 }
        replay: { type: boolean }
        acceptedProtocols:
          type: array
          items: { type: string }
    ClientSessionSummaryResponse:
      type: object
      additionalProperties: false
      required: [clientSessionId, principalId, clientId, clientKind, acceptedProtocols, createdAtMillis, lastHeartbeatAtMillis, expiresAtMillis, state]
      properties:
        clientSessionId: { type: string, format: uuid }
        principalId: { type: string }
        clientId: { type: string, format: uuid }
