        contextTokenOptions:
          type: array
          description: Selectable context budgets declared by the model; clients must not submit arbitrary token values.
          items:
            type: integer
            format: int32
        reasoningEffortOptions:
          type: array
          items:
            type: string
        configured:
          type: boolean
        routePolicyName:
          type: string
          nullable: true
        availability:
