          format: int64
        updatedAt:
          type: integer
          format: int64
        archivedAt:
          type: integer
          format: int64
          nullable: true
        writeAllow:
          type: array
          items:
            type: string
        writeForbid:
          type: array
          items:
            type: string
        contextDirectories:
          type: array
          maxItems: 64
          items: { type: string, maxLength: 4096 }
        directoryPolicyVersion: { type: integer, enum: [1, 2] }
        directories: { type: array, items: { $ref: "#/components/schemas/SessionDirectory" } }
        directoryAccess: { $ref: "#/components/schemas/DirectoryAccess", nullable: true }
        verificationLevel:
          type: string
          nullable: true
        maxModelTurns:
          type: integer
        maxEditAttempts:
          type: integer
        workspaceBinding:
          $ref: "#/components/schemas/WorkspaceBindingResponse"
          nullable: true
        messages:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              clientMessageId:
                type: string
                nullable: true
              role:
                type: string
              content:
                type: string
              status:
                type: string
                nullable: true
              taskId:
                type: string
                nullable: true
              runId:
                type: string
                nullable: true
              reasoning:
                type: string
                nullable: true
                description: |
                  Provider-returned display reasoning for ordinary-chat
                  assistant turns (design 2026-09-18). Bounded public text
                  only; run-scoped turns carry reasoning on
                  /runs/{runId}/reasoning.
              reasoningTruncated:
                type: boolean
                nullable: true
                description: True when the stored reasoning hit a capture bound
              attachments:
                type: array
                nullable: true
                description: Attachment light projection (id/name/mediaType/sizeBytes/sha256; no textContent).
                items:
                  type: object
                  properties:
                    id: { type: string, nullable: true }
                    name: { type: string, nullable: true }
                    mediaType: { type: string, nullable: true }
                    sizeBytes: { type: integer, format: int64, nullable: true }
                    sha256: { type: string, nullable: true }
              createdAt:
                type: integer
                format: int64
              updatedAt:
                type: integer
                format: int64
        eventCursor:
          type: integer
          format: int64
    AttentionItem:
      type: object
      properties:
        attentionId:
          type: string
        sourceType:
          type: string
          nullable: true
        sourceId:
          type: string
          nullable: true
        sourceVersion:
          type: integer
          format: int64
        sessionId:
          type: string
          nullable: true
        missionId:
          type: string
          nullable: true
        attentionType:
          type: string
          nullable: true
