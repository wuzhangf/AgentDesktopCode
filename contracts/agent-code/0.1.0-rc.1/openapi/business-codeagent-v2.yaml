          type: integer
          format: int32
          nullable: true
        activitySequence:
          type: integer
          format: int64
          nullable: true
        activityId:
          type: string
        runId:
          type: string
        roundId:
          type: string
          nullable: true
          description: >-
            Model-interaction round key (design 2026-09-19 §5.1): the Product
            logical model-call id shared by every product of one call.
            Absent on legacy or runtime-owned items; never inferred.
        roundOrdinal:
          type: integer
          format: int32
          nullable: true
          description: Optional 1-based round order inside the run.
        kind:
          type: string
          description: Stable activity kind (FILE_READ, CODE_SEARCH, COMMAND, BUILD, GIT, ...).
        status:
          type: string
          description: RUNNING / SUCCEEDED / PARTIAL / FAILED / TIMED_OUT / REJECTED / CANCELLED / WAITING_APPROVAL / ABORTED / UNKNOWN.
        toolName:
          type: string
          nullable: true
        capabilityId:
          type: string
          nullable: true
        detail:
          type: string
          nullable: true
        commandPreview:
          type: string
          nullable: true
          description: Redacted, bounded command preview; never raw arguments.
        redactionState:
          type: string
          enum: [NONE, REDACTED, WITHHELD]
        targets:
          type: array
          items:
            $ref: "#/components/schemas/RunActivityTargetResponse"
        startedAt:
          type: string
          nullable: true
        finishedAt:
          type: string
          nullable: true
        durationMillis:
          type: integer
          format: int64
          nullable: true
        resultSummary:
          type: string
          nullable: true
        reasonCode:
          type: string
          nullable: true
        failure:
          $ref: "#/components/schemas/FailureDescriptorResponse"
          nullable: true
        truncated:
          type: boolean
          nullable: true
        startCursor:
          type: integer
          format: int64
        endCursor:
          type: integer
          format: int64
        groupId:
          type: string
          nullable: true
          description: Stable service-owned purpose-group identity, when supported.
        groupPurpose:
          type: string
          nullable: true
          description: Service-provided purpose label; never inferred by the client.
        groupStartNote:
          type: string
          nullable: true
        groupSummary:
          type: string
          nullable: true
        groupStatus:
          type: string
          nullable: true
        groupStartedAt:
          type: string
          nullable: true
        groupFinishedAt:
          type: string
          nullable: true
        fileRef:
          type: string
          nullable: true
          description: Workspace-relative trusted file reference for FILE_READ.
        fileName:
          type: string
          nullable: true
          description: Trusted display name for FILE_READ; not a path search key.
        relativeDirectory:
          type: string
          nullable: true
          description: Workspace-relative directory for FILE_READ.
        startLine:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        endLine:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        bytesRead:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        fileSizeBytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        workingDirectory:
          type: string
          nullable: true
          description: Safe workspace-relative working directory, when available.
        statusOrigin:
          type: string
          nullable: true
          enum: [PERSISTED, DERIVED, null]
    RunActivitySummaryResponse:
      type: object
