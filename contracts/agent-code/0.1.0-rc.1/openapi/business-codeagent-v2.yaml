          enum: [AVAILABLE, UNCONFIGURED, UNAVAILABLE]
    ModelCatalogResponse:
      type: object
      required: [items]
      properties:
        defaultModel:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelCatalogEntry"
    AgentProfileSummary:
      type: object
      additionalProperties: false
      required: [id, name, description, revision, readonlyResearchDefault]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
