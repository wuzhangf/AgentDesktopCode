    RunReasoningResponse:
      type: object
      required: [runId, runStateVersion, snapshotCursor, text, receivedBytes, totalBytes, droppedChunks, lastSequence, terminal, complete, truncated]
      properties:
        runId:
          type: string
        runStateVersion:
          type: integer
          format: int64
        snapshotCursor:
          type: integer
          format: int64
        retentionFloor:
          type: integer
          format: int64
        text:
          type: string
          description: Assembled display reasoning in relay sequence order; bounded
        receivedBytes:
          type: integer
          format: int64
        totalBytes:
          type: integer
          format: int64
          description: Bytes the relay accepted, including parts dropped by rate limiting or truncation
        droppedChunks:
          type: integer
          format: int64
        lastSequence:
          type: integer
          format: int64
        terminal:
          type: boolean
          description: True when the run is terminal; text is then the authoritative end state
        complete:
          type: boolean
        reasonCode:
          type: string
          nullable: true
          description: TERMINAL_EXACT / LIVE_LOWER_BOUND / INCOMPLETE machine reason
        truncated:
          type: boolean
          description: True when the assembled text hit the response-side bound
        segments:
          type: array
          description: >-
            Per-round display reasoning (design 2026-09-19 §5.4). Empty when
            no frame carried a round key; the run-level text stays the
            authoritative aggregate for legacy consumers.
          items:
            $ref: "#/components/schemas/RunReasoningSegmentResponse"
    RunReasoningSegmentResponse:
      type: object
      required: [roundId, text, truncated, complete, lastSequence]
      properties:
        roundId:
          type: string
          description: Product logical model-call id shared by the round's frames.
        roundOrdinal:
          type: integer
          format: int32
          nullable: true
          description: Optional 1-based round order inside the run.
        text:
          type: string
          description: Assembled display reasoning for this round; bounded.
        truncated:
          type: boolean
          description: True when this segment hit the response-side text bound.
        complete:
          type: boolean
          description: >-
            True when the segment is provably complete for the data retained
            (round-local honesty combined with the stream-level verdict).
        lastSequence:
          type: integer
          format: int64
          description: Highest frame sequence contributing to this segment.
    RunOutputResponse:
      type: object
      required: [runId, runStateVersion, snapshotCursor, text, receivedBytes, totalBytes, droppedChunks, lastSequence, terminal, complete, truncated]
      properties:
        runId:
          type: string
        runStateVersion:
          type: integer
          format: int64
        snapshotCursor:
          type: integer
          format: int64
        retentionFloor:
          type: integer
          format: int64
        text:
          type: string
          description: Assembled visible output in relay sequence order; bounded
        receivedBytes:
          type: integer
          format: int64
        totalBytes:
          type: integer
          format: int64
          description: Bytes the relay accepted, including parts dropped by rate limiting or truncation
        droppedChunks:
          type: integer
          format: int64
        lastSequence:
          type: integer
          format: int64
        terminal:
          type: boolean
          description: True when the run is terminal; text is then the authoritative end state
        complete:
          type: boolean
        reasonCode:
          type: string
          nullable: true
          description: TERMINAL_EXACT / LIVE_LOWER_BOUND / INCOMPLETE machine reason
        truncated:
          type: boolean
          description: True when the assembled text hit the response-side bound
        segments:
          type: array
          description: >-
            Per-round visible output (design 2026-09-19 §5.5-B). Empty when
            no frame carried a round key; the run-level text stays the
            authoritative aggregate for legacy consumers.
          items:
            $ref: "#/components/schemas/RunOutputSegmentResponse"
    RunOutputSegmentResponse:
      type: object
      required: [roundId, text, truncated, complete, lastSequence]
      properties:
        roundId:
          type: string
          description: Product logical model-call id shared by the round's frames.
        roundOrdinal:
          type: integer
          format: int32
          nullable: true
          description: Optional 1-based round order inside the run.
        text:
          type: string
          description: Assembled visible output for this round; bounded.
        truncated:
          type: boolean
          description: True when this segment hit the response-side text bound.
        complete:
          type: boolean
        lastSequence:
          type: integer
          format: int64
          description: Highest frame sequence contributing to this segment.
    EvidenceLayer:
      type: string
      enum:
        - SOURCE
        - DETERMINISTIC_TEST
        - PACKAGE
        - RUNTIME
        - LIVE_MODEL
        - TRACE
        - GUI
        - SCENARIO_ORACLE
        - EXECUTION_ACTIVITY
    EvidenceStatus:
      type: string
      enum: [PRESENT, NOT_RUN, FAILED, INCOMPLETE, NOT_APPLICABLE]
    EvidenceItemResponse:
      type: object
      required: [evidenceId, layer, status]
      properties:
        evidenceId:
          type: string
        layer:
          $ref: "#/components/schemas/EvidenceLayer"
        status:
          $ref: "#/components/schemas/EvidenceStatus"
        summary:
          type: object
          additionalProperties: true
    EvidenceBundleResponse:
      type: object
      required: [runId, generatedAt, complete, items]
      properties:
        runId:
          type: string
        generatedAt:
          type: string
        complete:
          type: boolean
          description: True only when every layer is PRESENT or NOT_APPLICABLE.
        items:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceItemResponse"
        stateVersion:
          type: integer
          format: int64
          nullable: true
        artifactsReady:
          type: boolean
          nullable: true
        deliveryStatus:
          type: string
          nullable: true
          enum: [PENDING, AVAILABLE, PARTIAL, UNAVAILABLE]
        changeArtifactRef:
          type: string
          nullable: true
        manifestRef:
          $ref: "#/components/schemas/EvidenceManifestRef"
          nullable: true
        verificationV2:
          type: object
          nullable: true
          additionalProperties: true
        outcomeSeverity:
          type: string
          nullable: true
          enum: [OK, WARNING, ERROR]
    EvidenceManifestRef:
      type: object
      additionalProperties: false
      properties:
        manifestId:
          type: string
        sha256:
          type: string
        stateVersion:
          type: integer
          format: int64
    ModelCatalogEntry:
      type: object
      required: [modelAlias, configured, availability]
      properties:
        providerId:
          type: string
          nullable: true
        protocol:
          type: string
          nullable: true
        providerDisplayName:
          type: string
          nullable: true
        modelAlias:
          type: string
        capabilities:
          type: array
          items:
            type: string
        maxContextLevel:
          type: string
          nullable: true
        contextWindowTokens:
          type: integer
          format: int64
          nullable: true
          description: Physical model context window in tokens.
        contextUsedTokens:
          type: integer
          format: int64
          nullable: true
          description: Latest prompt size reported by the model service.
        cacheHitRatePercent:
          type: number
          format: double
          nullable: true
          description: Average cached-input ratio reported by the model service, as a percentage.
        usageSampleCount:
          type: integer
          format: int64
          nullable: true
