        uniqueWrittenFileCount:
          type: integer
        commandCount:
          type: integer
        startedAt:
          type: string
          nullable: true
        finishedAt:
          type: string
          nullable: true
        updatedAt:
          type: string
          nullable: true
        sourceCursor:
          type: integer
