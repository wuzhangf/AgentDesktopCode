schemaVersion: "1"
failures:
  - code: MODEL_TOOL_ARGUMENTS_INVALID
    domain: TOOL_INPUT
    allowedPhases: [PREPARE, VALIDATE]
    defaultDisposition: AUTO_RECOVERING
    allowedRecoveryModes: [MODEL_REPAIR_INPUT, NONE]
    defaultEffectState: NOT_APPLIED
    actionIds: [SHOW_TOOL_DETAILS]
  - code: MODEL_RESPONSE_INCOMPLETE
    domain: MODEL_PROTOCOL
    allowedPhases: [RECEIVE, VALIDATE]
    defaultDisposition: AUTO_RECOVERING
    allowedRecoveryModes: [NEW_MODEL_ATTEMPT, NONE]
    defaultEffectState: NOT_APPLIED
    actionIds: [CONTINUE_RESPONSE]
  - code: MODEL_STREAM_TERMINATOR_MISSING
    domain: MODEL_TRANSPORT
    allowedPhases: [RECEIVE]
    defaultDisposition: USER_ACTION_REQUIRED
    allowedRecoveryModes: [NEW_MODEL_ATTEMPT, NONE]
    defaultEffectState: UNKNOWN
    actionIds: [RETRY_WITH_RECONCILIATION]
  - code: PATH_OUTSIDE_WORKSPACE
    domain: WORKSPACE_SCOPE
    allowedPhases: [PREPARE, VALIDATE, EXECUTE]
    defaultDisposition: USER_ACTION_REQUIRED
    allowedRecoveryModes: [MODEL_REPAIR_INPUT, NONE]
    defaultEffectState: NOT_APPLIED
    actionIds: [SHOW_TOOL_DETAILS]
  - code: SNAPSHOT_BINDING_MISMATCH
    domain: WORKSPACE_SNAPSHOT
    allowedPhases: [ADMISSION, PREPARE, VALIDATE, EXECUTE, RECONCILE]
    defaultDisposition: USER_ACTION_REQUIRED
    allowedRecoveryModes: [NONE]
    defaultEffectState: NOT_APPLIED
    actionIds: [SHOW_TOOL_DETAILS]
  - code: WORKSPACE_SNAPSHOT_INCOMPLETE
    domain: WORKSPACE_SNAPSHOT
    allowedPhases: [ADMISSION, PREPARE, VALIDATE, RECONCILE]
    defaultDisposition: USER_ACTION_REQUIRED
    allowedRecoveryModes: [RETRY_OPERATION, NONE]
    defaultEffectState: NOT_APPLIED
    actionIds: [SHOW_TOOL_DETAILS]
  - code: WORKSPACE_SNAPSHOT_UNTRUSTED
    domain: WORKSPACE_SNAPSHOT
    allowedPhases: [PREPARE, VALIDATE, RECONCILE]
    defaultDisposition: USER_ACTION_REQUIRED
    allowedRecoveryModes: [NONE]
    defaultEffectState: UNKNOWN
    actionIds: [SHOW_TOOL_DETAILS]
  - code: WORKSPACE_BASELINE_MISSING
    domain: WORKSPACE_SNAPSHOT
    allowedPhases: [PREPARE, EXECUTE, RECONCILE]
    defaultDisposition: OPERATOR_ACTION_REQUIRED
    allowedRecoveryModes: [NONE]
    defaultEffectState: UNKNOWN
    actionIds: [SHOW_TOOL_DETAILS]
  - code: DELIVERY_CANDIDATE_UNTRUSTED
    domain: DELIVERY
    allowedPhases: [VALIDATE, RECONCILE]
    defaultDisposition: USER_ACTION_REQUIRED
    allowedRecoveryModes: [NONE]
    defaultEffectState: NOT_APPLIED
    actionIds: [SHOW_TOOL_DETAILS]
  - code: RUNTIME_ERROR
    domain: INTERNAL
    allowedPhases: [EXECUTE]
    defaultDisposition: TERMINAL
    allowedRecoveryModes: [NONE]
    defaultEffectState: UNKNOWN
    actionIds: []
  - code: ATTACHMENT_IMAGE_INVALID
    domain: TOOL_INPUT
    allowedPhases: [ADMISSION, VALIDATE]
    defaultDisposition: USER_ACTION_REQUIRED
    allowedRecoveryModes: [NONE]
    defaultEffectState: NOT_APPLIED
    actionIds: []
  - code: ATTACHMENT_LIMIT_EXCEEDED
    domain: TOOL_INPUT
    allowedPhases: [ADMISSION, VALIDATE]
    defaultDisposition: USER_ACTION_REQUIRED
    allowedRecoveryModes: [NONE]
    defaultEffectState: NOT_APPLIED
    actionIds: []
  - code: MODEL_IMAGE_INPUT_UNSUPPORTED
    domain: CONTEXT
    allowedPhases: [PREPARE, VALIDATE]
    defaultDisposition: USER_ACTION_REQUIRED
    allowedRecoveryModes: [NONE]
    defaultEffectState: NOT_APPLIED
    actionIds: []
  - code: INPUT_ASSET_NOT_ACCESSIBLE
    domain: PERMISSION
    allowedPhases: [ADMISSION, VALIDATE]
    defaultDisposition: USER_ACTION_REQUIRED
    allowedRecoveryModes: [NONE]
    defaultEffectState: NOT_APPLIED
    actionIds: []
  - code: INPUT_ASSET_MISSING
    domain: SERVICE_TRANSPORT
    allowedPhases: [ADMISSION, PREPARE, VALIDATE]
    defaultDisposition: USER_ACTION_REQUIRED
    allowedRecoveryModes: [RETRY_OPERATION, NONE]
    defaultEffectState: NOT_APPLIED
    actionIds: []
  - code: INPUT_ASSET_HASH_MISMATCH
    domain: INTERNAL
    allowedPhases: [ADMISSION, PREPARE, VALIDATE]
    defaultDisposition: OPERATOR_ACTION_REQUIRED
    allowedRecoveryModes: [RETRY_OPERATION, NONE]
    defaultEffectState: UNKNOWN
    actionIds: []
