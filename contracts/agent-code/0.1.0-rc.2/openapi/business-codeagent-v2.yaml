          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Deterministic activity fold with honest completeness flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunActivityListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
