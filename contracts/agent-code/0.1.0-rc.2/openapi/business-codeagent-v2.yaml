          format: int64
        snapshotCursor:
          type: integer
          format: int64
        retentionFloor:
          type: integer
          format: int64
        text:
          type: string
          description: Assembled visible output in relay sequence order; bounded
        receivedBytes:
          type: integer
          format: int64
        totalBytes:
          type: integer
          format: int64
          description: Bytes the relay accepted, including parts dropped by rate limiting or truncation
        droppedChunks:
          type: integer
          format: int64
        lastSequence:
          type: integer
          format: int64
        terminal:
          type: boolean
          description: True when the run is terminal; text is then the authoritative end state
        complete:
