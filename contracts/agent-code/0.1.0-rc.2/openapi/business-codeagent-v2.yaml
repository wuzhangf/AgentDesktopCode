      operationId: getExecutionExtensions
      summary: |
        Binding, activation and context-manifest evidence of one execution
        (workspace run or plain chat). Proves which content entered which
        model request; never claims the model obeyed it.
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
      responses:
        "200":
          description: Extension binding evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionExtensionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/executions/{executionId}/extension-invocations:
    get:
      operationId: listExecutionExtensionInvocations
      summary: |
        Paged invocation list of one execution. UNKNOWN rows mean the
        external effect could not be confirmed — they are never retried
        silently.
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
        - name: cursor
          in: query
          schema: { type: string, nullable: true }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page of invocation views
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionInvocationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/hooks:
    get:
      operationId: listHooks
      summary: |
        EW10.6 typed hooks: operator-allowlisted lifecycle observers with
        health status. Command material never leaves the service. Gated by
        the hooks capability flag.
      responses:
        "200":
          description: Hook summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HookSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/hooks/executions:
    get:
      operationId: listHookExecutions
      summary: Bounded recent hook executions (status and duration only).
      responses:
        "200":
          description: Recent execution records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookExecutionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Loopback bearer token; never exposed to the renderer.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ClientSessionId:
      name: clientSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClientSessionToken:
      name: X-CodeAgent-Client-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    BusinessSessionId:
      name: businessSessionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    TerminalSessionId:
      name: terminalSessionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^term_[A-Za-z0-9]{32}$"
    ServerId:
      name: serverId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9_-]{1,64}$"
    SkillId:
      name: skillId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    SkillVersionDigest:
      name: versionDigest
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9:._-]{1,128}$"
    McpOperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    SpecId:
      name: specId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    MissionId:
      name: missionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    WorkspaceLaneId:
      name: workspaceLaneId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    GitOperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    GitCommitId:
      name: commitId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    PublicationId:
      name: publicationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 256
      description: CAS version precondition, for example "sha256:<digest>:<size>"
  responses:
    Problem:
      description: Stable problem document
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Bearer token is required
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ClientRegistrationRequest:
      type: object
      additionalProperties: false
      required: [registrationKey, clientId, processInstanceId, clientKind, protocols]
      properties:
        registrationKey: { type: string, format: uuid }
        clientId: { type: string, format: uuid }
        processInstanceId: { type: string, format: uuid }
        clientKind: { type: string, enum: [ELECTRON, WEB_TAB, CLI, SWING] }
        protocols:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        displayLabel: { type: string, maxLength: 64 }
    ClientSessionResponse:
      type: object
      additionalProperties: false
      required: [clientSessionId, clientSessionToken, storeId, bootId, ttlMillis, remainingTtlMillis, acceptedProtocols]
      properties:
        clientSessionId: { type: string, format: uuid }
        clientSessionToken: { type: string, minLength: 64, maxLength: 256, writeOnly: true }
        storeId: { type: string }
        bootId: { type: string, format: uuid }
        ttlMillis: { type: integer, format: int64, minimum: 1 }
        remainingTtlMillis: { type: integer, format: int64, minimum: 0 }
        replay: { type: boolean }
        acceptedProtocols:
          type: array
          items: { type: string }
    ClientSessionSummaryResponse:
      type: object
      additionalProperties: false
      required: [clientSessionId, principalId, clientId, clientKind, acceptedProtocols, createdAtMillis, lastHeartbeatAtMillis, expiresAtMillis, state]
      properties:
        clientSessionId: { type: string, format: uuid }
        principalId: { type: string }
        clientId: { type: string, format: uuid }
        clientKind: { type: string }
        acceptedProtocols: { type: array, items: { type: string } }
        displayLabel: { type: string }
        createdAtMillis: { type: integer, format: int64 }
        lastHeartbeatAtMillis: { type: integer, format: int64 }
        expiresAtMillis: { type: integer, format: int64 }
        state: { type: string, enum: [ACTIVE] }
    ClientHeartbeatResponse:
      type: object
      additionalProperties: false
      required: [clientSessionId, serverTimeMillis, remainingTtlMillis]
      properties:
        clientSessionId: { type: string, format: uuid }
        serverTimeMillis: { type: integer, format: int64 }
        remainingTtlMillis: { type: integer, format: int64, minimum: 0 }
    OperationLookupRequest:
      type: object
      additionalProperties: false
      required: [operation, resourceId, idempotencyKey]
      properties:
        operation: { type: string, minLength: 1, maxLength: 128 }
        resourceId: { type: string, minLength: 1, maxLength: 128 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
    OperationReceiptResponse:
      type: object
      additionalProperties: false
      required: [receiptId, operation, resourceId, status, requestHash, createdAtMillis]
      properties:
        receiptId: { type: string, pattern: "^rcpt_[0-9a-f]{64}$" }
        operation: { type: string }
        resourceId: { type: string }
        status: { type: string, enum: [APPLIED, PENDING, NOT_APPLIED, UNKNOWN] }
        requestHash: { type: string }
        createdAtMillis: { type: integer, format: int64 }
        result:
          type: object
          nullable: true
          additionalProperties: true
    EventSnapshotResponse:
      type: object
      additionalProperties: false
      required: [consistency, events, nextCursor, scannedThroughCursor, highWaterMark,
        retentionFloor, snapshotCursor, expiresAt, complete, truncated, responseBytes]
      properties:
        consistency: { type: string, enum: [RESOURCE_VERSIONED] }
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        nextCursor: { type: integer, format: int64 }
        scannedThroughCursor: { type: integer, format: int64 }
        highWaterMark: { type: integer, format: int64 }
        retentionFloor: { type: integer, format: int64 }
        snapshotCursor: { type: integer, format: int64 }
        nextPageToken: { type: string, nullable: true, maxLength: 512 }
        expiresAt: { type: integer, format: int64 }
        complete: { type: boolean }
        truncated: { type: boolean }
        responseBytes: { type: integer, minimum: 0 }
    ExecutionPolicyResponse:
      type: object
      additionalProperties: false
      required: [principalId, projectId, revision, mode, managedModeCeiling, supportedModes,
        routineDelayMillis, planDelayMillis, budgetDelayMillis, maxAutomaticBudgetApprovals,
        approvalTtlMillis, fullAccessConfirmed, policyFingerprint, serverTime]
      properties:
        schemaVersion: { type: string }
        principalId: { type: string, minLength: 1, maxLength: 128 }
        projectId: { type: string, minLength: 1, maxLength: 128 }
        revision: { type: integer, format: int64, minimum: 1 }
        mode: { type: string, enum: [STANDARD, AUTO_APPROVE, FULL_ACCESS] }
        managedModeCeiling: { type: string, enum: [STANDARD, AUTO_APPROVE, FULL_ACCESS] }
        supportedModes:
          type: array
          minItems: 1
          maxItems: 3
          items: { type: string, enum: [STANDARD, AUTO_APPROVE, FULL_ACCESS] }
        routineDelayMillis: { type: integer, format: int64, minimum: 0, maximum: 86400000 }
        planDelayMillis: { type: integer, format: int64, minimum: 0, maximum: 86400000 }
        budgetDelayMillis:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: integer, format: int64, minimum: 0, maximum: 86400000 }
        maxAutomaticBudgetApprovals: { type: integer, minimum: 0, maximum: 100 }
        approvalTtlMillis: { type: integer, format: int64, minimum: 1000, maximum: 604800000 }
        fullAccessConfirmed: { type: boolean }
        policyFingerprint: { type: string, minLength: 1, maxLength: 128 }
        serverTime: { type: string, format: date-time }
    ExecutionPolicyUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        requestedMode: { type: string, enum: [STANDARD, AUTO_APPROVE, FULL_ACCESS] }
        routineDelayMillis: { type: integer, format: int64, minimum: 0, maximum: 86400000 }
        planDelayMillis: { type: integer, format: int64, minimum: 0, maximum: 86400000 }
        budgetDelayMillis:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: integer, format: int64, minimum: 0, maximum: 86400000 }
        maxAutomaticBudgetApprovals: { type: integer, minimum: 0, maximum: 100 }
        approvalTtlMillis: { type: integer, format: int64, minimum: 1000, maximum: 604800000 }
        acknowledgementVersion: { type: string, maxLength: 64 }
        fullAccessConfirmation: { type: boolean, default: false }
        applyToPendingApprovalIds:
          type: array
          maxItems: 100
          items: { type: string, pattern: "^[A-Za-z0-9._-]{1,128}$" }
    AutomationControlRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, control]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        control: { type: string, enum: [PAUSE_AUTOMATION, RESUME_AUTOMATION] }
    AutomationControlResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, principalId, sessionId, paused, version, updatedAtMillis, serverTime]
      properties:
        schemaVersion: { type: string }
        principalId: { type: string, minLength: 1, maxLength: 128 }
        sessionId: { type: string, minLength: 1, maxLength: 128 }
        paused: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
        updatedAtMillis: { type: integer, format: int64, minimum: 0 }
        serverTime: { type: string, format: date-time }
    ApprovalRequestV2:
      type: object
      additionalProperties: false
      required: [approvalId, sessionId, runId, agentId, kind, domainRef, domainVersion,
        requestVersion, decisionStatus, executionStatus, requestFingerprint, policyFingerprint,
        grantRevision, riskCategory, publicSummary, expiresAt, serverTime, allowedActions, version]
      properties:
        approvalId: { type: string, pattern: "^[A-Za-z0-9._-]{1,128}$" }
        sessionId: { type: string, minLength: 1, maxLength: 128 }
        runId: { type: string, minLength: 1, maxLength: 128 }
        agentId: { type: string, minLength: 1, maxLength: 128 }
        kind: { type: string, enum: [COMMAND, WRITE, BUDGET, SANDBOX, SPEC, PLAN, REPLAN, UNKNOWN] }
        domainRef: { type: string, minLength: 1, maxLength: 128 }
        domainVersion: { type: integer, format: int64, minimum: 0 }
        requestVersion: { type: integer, format: int64, minimum: 0 }
        decisionStatus: { type: string }
        executionStatus: { type: string }
        requestFingerprint: { type: string, minLength: 1, maxLength: 256 }
        policyFingerprint: { type: string, minLength: 1, maxLength: 256 }
        grantRevision: { type: integer, format: int64, minimum: 0 }
        riskCategory: { type: string, enum: [NONE, UNCLASSIFIED, D1_IRRECOVERABLE_USER_DATA_LOSS, D2_SHARED_OR_PRODUCTION_DESTRUCTION, D3_SENSITIVE_DISCLOSURE_OR_SECURITY_BOUNDARY, D4_IRREVERSIBLE_EXTERNAL_COMMIT] }
        riskEvidence:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 500 }
        publicSummary: { type: string, maxLength: 500 }
        autoApproveAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time }
        serverTime: { type: string, format: date-time }
        allowedActions:
          type: array
          maxItems: 8
          items: { type: string, enum: [APPROVE, EXECUTE, DENY, CANCEL, ADVANCE, PAUSE_DELAY, RESUME_DELAY] }
        version: { type: integer, format: int64, minimum: 1 }
        decision: { type: string, nullable: true }
        decisionSource: { type: string, nullable: true }
    ApprovalListResponse:
      type: object
      additionalProperties: false
      required: [items, serverTime, projectionVersion]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ApprovalRequestV2" }
        serverTime: { type: string, format: date-time }
        projectionVersion: { type: integer, format: int64, minimum: 0 }
        nextCursor: { type: string, nullable: true, maxLength: 32 }
    ApprovalDecisionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, decision]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        fingerprint: { type: string, minLength: 1, maxLength: 256, nullable: true }
        requestFingerprint: { type: string, minLength: 1, maxLength: 256, nullable: true }
        decision: { type: string, enum: [APPROVE, DENY, REJECT, CANCEL, EXECUTE] }
    ApprovalAdvanceRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        fingerprint: { type: string, minLength: 1, maxLength: 256, nullable: true }
        requestFingerprint: { type: string, minLength: 1, maxLength: 256, nullable: true }
        control: { type: string, enum: [PAUSE_DELAY, RESUME_DELAY, CANCEL], nullable: true }
    TerminalSessionCreateRequest:
      type: object
      additionalProperties: false
      required: [workspaceExecutionId, executable]
      properties:
        workspaceExecutionId:
          type: string
          minLength: 1
          maxLength: 128
        createdByRunId:
          type: string
          nullable: true
          maxLength: 128
        profile:
          type: string
          enum: [DIRECT_PROCESS, USER_SHELL, AGENT_SHELL, DEBUGGER_CLI]
        executable:
          type: string
          minLength: 1
          maxLength: 256
        arguments:
          type: array
          maxItems: 128
          items:
            type: string
            maxLength: 4096
        workingDirectory:
          type: string
          minLength: 1
          maxLength: 1024
        columns:
          type: integer
          minimum: 1
          maximum: 4096
        rows:
          type: integer
          minimum: 1
          maximum: 4096
        lifetimeScope:
          type: string
          enum: [RUN, SESSION, WORKSPACE]
        inputPolicy:
          type: string
          enum: [NONE, BOUNDED_TEXT, RAW, USER_ONLY]
        terminalMode:
          type: string
          enum: [LINE_STREAM, FULL_VT]
        networkIntent:
          type: string
          enum: [INHERIT, DENY, ALLOW]
        maxLifetimeMillis:
          type: integer
          format: int64
          minimum: 1
          maximum: 86400000
        workspaceLineageId:
          type: string
          nullable: true
          maxLength: 256
        leaseId:
          type: string
          nullable: true
          maxLength: 256
    TerminalAllowedActions:
      type: object
      additionalProperties: false
      required: [canReadOutput, canWriteInput, canResize, canInterrupt, canTerminate, canClose, canAgentWrite, canUserWrite]
      properties:
        canReadOutput: { type: boolean }
        canWriteInput: { type: boolean }
        canResize: { type: boolean }
        canInterrupt: { type: boolean }
        canTerminate: { type: boolean }
        canClose: { type: boolean }
        canAgentWrite: { type: boolean }
        canUserWrite: { type: boolean }
    TerminalSessionResponse:
      type: object
      additionalProperties: false
      required: [terminalSessionId, businessSessionId, serviceInstanceId, state, stateVersion, lifetimeScope, profile, terminalMode, inputPolicy, controller, columns, rows, outputBytes, inputVersion, controlState, controlVersion, controlEpoch, canAcquire, canInput, remainingControlTtlMillis, allowedActions]
      properties:
        terminalSessionId: { type: string }
        businessSessionId: { type: string }
        workspaceExecutionId: { type: string, nullable: true }
        createdByRunId: { type: string, nullable: true }
        serviceInstanceId: { type: string }
        state: { type: string, enum: [PENDING_APPROVAL, STARTING, RUNNING, INTERRUPTING, EXITED, TERMINATING, TERMINATED, FAILED, LOST, CLOSED] }
        stateVersion: { type: integer, format: int64 }
        lifetimeScope: { type: string, enum: [RUN, SESSION, WORKSPACE] }
        profile: { type: string, enum: [DIRECT_PROCESS, USER_SHELL, AGENT_SHELL, DEBUGGER_CLI] }
        terminalMode: { type: string, enum: [LINE_STREAM, FULL_VT] }
        inputPolicy: { type: string, enum: [NONE, BOUNDED_TEXT, RAW, USER_ONLY] }
        controller: { type: string, enum: [NONE, USER, AGENT] }
        columns: { type: integer }
        rows: { type: integer }
        outputCursor: { type: string, nullable: true }
        outputBytes: { type: integer, format: int64 }
        inputVersion: { type: integer, format: int64 }
        startedAt: { type: string, nullable: true, format: date-time }
        lastActivityAt: { type: string, nullable: true, format: date-time }
        expiresAt: { type: string, nullable: true, format: date-time }
        exitCode: { type: integer, nullable: true }
        terminalCause: { type: string, nullable: true }
        controlState: { type: string, enum: [FREE, ACTIVATING, HELD, RELEASING, RECONCILE_REQUIRED, CLOSED] }
        controlVersion: { type: integer, format: int64, minimum: 0 }
        controlEpoch: { type: integer, format: int64, minimum: 0 }
        canAcquire: { type: boolean }
        canInput: { type: boolean }
        safeHolderLabel: { type: string, nullable: true, maxLength: 64 }
        remainingControlTtlMillis: { type: integer, format: int64, minimum: 0 }
        allowedActions:
          $ref: "#/components/schemas/TerminalAllowedActions"
    TerminalOutputMode:
      type: string
      enum: [RAW_VT, PLAIN_TEXT]
    TerminalOutputResponse:
      type: object
      additionalProperties: false
      required: [terminalSessionId, startOffset, endOffset, mode, state, eof, historyIncomplete, gap, serviceInstanceId]
      properties:
        terminalSessionId: { type: string }
        startCursor: { type: string, nullable: true }
        nextCursor: { type: string, nullable: true }
        startOffset: { type: integer, format: int64 }
        endOffset: { type: integer, format: int64 }
        dataBase64: { type: string, nullable: true }
        plainText: { type: string, nullable: true }
        mode:
          $ref: "#/components/schemas/TerminalOutputMode"
        state: { type: string }
        eof: { type: boolean }
        historyIncomplete: { type: boolean }
        gap: { type: boolean }
        serviceInstanceId: { type: string }
    TerminalInputRequest:
      type: object
      additionalProperties: false
      required: [operationId, expectedStateVersion, expectedInputVersion, leaseId, controlEpoch]
      properties:
        operationId: { type: string, minLength: 1, maxLength: 128 }
        expectedStateVersion: { type: integer, format: int64, minimum: 0 }
        expectedInputVersion: { type: integer, format: int64, minimum: 0 }
        encoding: { type: string, enum: [UTF8, BASE64] }
        text: { type: string, nullable: true, maxLength: 65536 }
        dataBase64: { type: string, nullable: true, maxLength: 131072 }
        controller: { type: string, enum: [USER, AGENT], deprecated: true, nullable: true }
        leaseId: { type: string, minLength: 1, maxLength: 256 }
        controlEpoch: { type: integer, format: int64, minimum: 0 }
    TerminalInputResponse:
      type: object
      additionalProperties: false
      required: [operationId, inputVersion, delivery]
      properties:
        operationId: { type: string }
        inputVersion: { type: integer, format: int64 }
        delivery: { type: string, enum: [PENDING, APPLIED, UNKNOWN, REJECTED] }
    TerminalResizeRequest:
      type: object
      additionalProperties: false
      required: [operationId, expectedStateVersion, columns, rows, resizeSequence, leaseId, controlEpoch]
      properties:
        operationId: { type: string, minLength: 1, maxLength: 128 }
        expectedStateVersion: { type: integer, format: int64, minimum: 0 }
        columns: { type: integer, minimum: 1, maximum: 4096 }
        rows: { type: integer, minimum: 1, maximum: 4096 }
        resizeSequence: { type: integer, format: int64, minimum: 0 }
        leaseId: { type: string, minLength: 1, maxLength: 256 }
        controlEpoch: { type: integer, format: int64, minimum: 0 }
    TerminalResizeResponse:
      type: object
      additionalProperties: false
      required: [columns, rows, resizeSequence]
      properties:
        columns: { type: integer }
        rows: { type: integer }
        resizeSequence: { type: integer, format: int64 }
    TerminalSignalRequest:
      type: object
      additionalProperties: false
