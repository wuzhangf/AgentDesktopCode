openapi: 3.0.3
info:
  title: Business Agent Code — Desktop Public API v2
  version: "2.1"
  description: |
    Canonical contract between the CodeAgent Desktop (Electron main) and the
    Business service (desktop detailed design 2026-08-28, §9).

    Conventions enforced by this contract:
    - Every mutation requires an Idempotency-Key header (1..128 chars) and,
      where the domain has a monotonic version, an expectedVersion /
      expectedStateVersion in the request body.
    - Errors use the Problem schema with a stable machine-readable `code`;
      UIs must not parse `message`.
    - Unknown enum values degrade to UNKNOWN and restrict mutations.
    - No secret material (API keys, tokens, profile paths, absolute provider
      endpoints) is ever part of a response schema.
    - Breaking changes require a protocol major version bump.

    Current scope: capabilities, projects, runs (view/list/interrupt/
    evidence), model catalog, artifact-backed diff/review projections, and
    bounded project-file reads. Services that cannot produce a persisted
    change artifact must return a typed Problem rather than fabricate a diff.
servers:
  - url: http://127.0.0.1:{port}
    description: loopback-only service
    variables:
      port:
        default: "8080"
security:
  - bearerAuth: []
paths:
  /api/v2/client-sessions:
    post:
      operationId: registerClientSession
      summary: Register one Electron/Web/CLI/Swing process for this Service boot
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientRegistrationRequest"
      responses:
        "201":
          description: Registered client session; response is no-store
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSessionResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listClientSessions
      summary: List safe active client-session projections for the local owner
      responses:
        "200":
          description: Active sessions without secrets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClientSessionSummaryResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v2/client-sessions/{clientSessionId}/heartbeat:
    post:
      operationId: heartbeatClientSession
      summary: Refresh a live client session using its in-memory secret
      parameters:
        - $ref: "#/components/parameters/ClientSessionId"
        - $ref: "#/components/parameters/ClientSessionToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Heartbeat result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientHeartbeatResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v2/client-sessions/{clientSessionId}:
    delete:
      operationId: revokeClientSession
      summary: Revoke this client session; repeating the same request is idempotent
      parameters:
        - $ref: "#/components/parameters/ClientSessionId"
        - $ref: "#/components/parameters/ClientSessionToken"
      responses:
        "204": { description: Revoked or already revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "410": { $ref: "#/components/responses/Problem" }
  /api/v2/operations/{receiptId}:
    get:
      operationId: getOperationReceipt
      summary: Read a previously accepted operation receipt
      parameters:
        - name: receiptId
          in: path
          required: true
          schema:
            type: string
            pattern: "^rcpt_[0-9a-f]{64}$"
      responses:
        "200":
          description: Durable operation receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationReceiptResponse"
        "404": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v2/operations/lookup:
    post:
      operationId: lookupOperationReceipt
      summary: Look up an operation without admitting or replaying it
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationLookupRequest"
      responses:
        "200":
          description: Durable operation receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationReceiptResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v2/event-snapshots:
    get:
      operationId: getEventSnapshot
      summary: Read a bounded scope snapshot at a fixed journal high-water mark
      parameters:
        - name: scopeType
          in: query
          required: true
          schema: { type: string, enum: [GLOBAL, SESSION, MISSION] }
        - name: scopeId
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: snapshotToken
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
      responses:
        "200":
          description: Fixed-high-water-mark event snapshot page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSnapshotResponse"
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
  /api/v2/sessions:
    get:
      operationId: listSessions
      summary: Session list (v2)
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSession
      summary: Create a Session (additive Session v2 API)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreateRequest"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v2/sessions/summaries:
    get:
      operationId: listSessionSummaries
      summary: Keyset-paginated session summaries (history pagination; capability session.summary.list)
      parameters:
        - name: workspaceAlias
          in: query
          schema: { type: string }
        - name: archived
          in: query
          description: ACTIVE (default) | ARCHIVED | ALL
          schema: { type: string, enum: [ACTIVE, ARCHIVED, ALL] }
        - name: q
          in: query
          description: Inclusive title-substring filter; user %/_ are literals, max 128 code points
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque signed continuation token from nextCursor
          schema: { type: string }
      responses:
        "200":
          description: Summary page validated against one list read revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummaryPageResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          description: HISTORY_REVISION_CHANGED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: HISTORY_CURSOR_EXPIRED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/sessions/{sessionId}:
    get:
      operationId: getSession
      summary: Session view (messages on inspect responses)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchSession
      summary: Optimistic session mutation
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionPatchRequest"
      responses:
        "200":
          description: Patched session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "409":
          description: SESSION_VERSION_CONFLICT
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v2/sessions/{sessionId}/model-settings:
    get:
      operationId: getSessionModelSettings
      summary: Versioned desired/effective model settings
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session model settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionModelSettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchSessionModelSettings
      summary: Atomically replace model settings for the next safe request
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionModelSettingsPatchRequest"
      responses:
        "200":
          description: Accepted settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionModelSettingsResponse"
        "202":
          description: Settings persisted and pending the next safe request boundary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionModelSettingsResponse"
        "409":
          description: Settings revision or catalog revision conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Invalid or unsupported model settings
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v2/sessions/{sessionId}/summary:
    get:
      operationId: getSessionSummary
      summary: One lightweight session summary (capability session.summary.read)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session summary without messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummaryResponse"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v2/sessions/{sessionId}/metadata:
    get:
      operationId: getSessionMetadata
      summary: Session contract/status projection without a messages field (capability session.metadata.read)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session metadata; message content lives on the paginated message endpoints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionMetadataResponse"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v2/sessions/{sessionId}/messages:
    get:
      operationId: pageSessionMessages
      summary: Keyset message page, oldest → newest (capability session.messages.page)
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: cursor
          in: query
          description: beforeCursor/afterCursor from a previous page; mutually exclusive with aroundMessageId
          schema: { type: string }
        - name: aroundMessageId
          in: query
          description: Re-anchor near this message after a revision change; mutually exclusive with cursor
          schema: { type: string }
      responses:
        "200":
          description: Message page; oversized bodies arrive as DEFERRED previews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionMessagePageResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: HISTORY_REVISION_CHANGED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: HISTORY_CURSOR_EXPIRED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: HISTORY_ITEM_TOO_LARGE
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Problem"
    post:
      operationId: sendSessionMessage
      summary: Accept a user message (202 Accepted; run progresses asynchronously)
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionMessageRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionMessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v2/sessions/{sessionId}/messages/{messageId}/content:
    get:
      operationId: getMessageContentPage
      summary: Bounded UTF-8 segment of one message body (capability session.message.content.read)
      description: >
        Segments concatenate only while contentRevision stays identical.
        maxBytes bounds the entire JSON response including escaping, not the
        raw text length; segments never split UTF-8 sequences.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/MessageId"
        - name: cursor
          in: query
          description: Opaque segment continuation token from nextCursor
          schema: { type: string }
        - name: maxBytes
          in: query
          description: Whole-response UTF-8 byte ceiling
          schema: { type: integer, minimum: 4096, maximum: 262144, default: 65536 }
      responses:
        "200":
          description: One content segment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageContentPageResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: HISTORY_REVISION_CHANGED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: HISTORY_CURSOR_EXPIRED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v2/sessions/{sessionId}/messages/{messageId}/attachments/{attachmentId}/content:
    get:
      operationId: getSessionAttachmentContent
      summary: Read accepted text-attachment content (bounded UTF-8 text/plain; Markdown is not rendered as HTML)
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/MessageId"
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: Attachment text content
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v2/sessions/{sessionId}/messages/{messageId}/attachments/{attachmentId}/bytes:
    get:
      operationId: getSessionAttachmentBytes
      summary: Read accepted image-attachment bytes from the server-owned blob store (multimodal design 7.8, WU-10)
      description: >
        Serves the original PNG/JPEG bytes of an IMAGE attachment. Session,
        message and attachment ownership is validated before the blob is
        read; a mismatching blob hash fails with INPUT_ASSET_HASH_MISMATCH
        and a missing blob with INPUT_ASSET_MISSING instead of silently
        degrading. Responses carry the authoritative image media type,
        Content-Length, Cache-Control: private, no-store and
        X-Content-Type-Options: nosniff. Text attachments must use the
        sibling content endpoint.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/MessageId"
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: Raw image bytes
          headers:
            Content-Length:
              description: Exact byte length of the image payload
              schema: { type: integer, format: int64 }
            Cache-Control:
              description: Always "private, no-store"
              schema: { type: string }
            X-Content-Type-Options:
              description: Always "nosniff"
              schema: { type: string }
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "410":
          description: INPUT_ASSET_MISSING (blob absent for an owned reference)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: INPUT_ASSET_HASH_MISMATCH (stored bytes do not match the frozen hash)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v2/sessions/{sessionId}/forks:
    post:
      operationId: forkSession
      summary: Fork a session lineage
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionForkRequest"
      responses:
        "201":
          description: Forked session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v2/sessions/{sessionId}/archive:
    post:
      operationId: archiveSession
      summary: Archive a session
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionArchiveRequest"
      responses:
        "200":
          description: Archived session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v2/attention:
    get:
      operationId: listAttention
      summary: Open attention items (read model; never the approval authority)
      responses:
        "200":
          description: Attention items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AttentionItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v2/sessions/{sessionId}/specs:
    post:
      operationId: createSpec
      summary: Draft a spec for the session (Task Contract v2)
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecCreateRequest"
      responses:
        "201":
          description: Created spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v2/specs/{specId}:
    get:
      operationId: getSpec
      summary: Spec view with contract markdown and fingerprints
      parameters:
        - $ref: "#/components/parameters/SpecId"
      responses:
        "200":
          description: Spec view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: reviseSpec
      summary: Optimistic spec revision (expectedRevision)
      parameters:
        - $ref: "#/components/parameters/SpecId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecRevisionRequest"
      responses:
        "200":
          description: Revised spec
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: SPEC_REVISION_CONFLICT (stale expectedRevision)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v2/specs/{specId}/approvals/{approvalId}/decisions:
    post:
      operationId: decideSpecApproval
      summary: Approve/reject a spec revision with fingerprint guards
      parameters:
        - $ref: "#/components/parameters/SpecId"
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecApprovalDecisionRequest"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecApprovalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: fingerprint mismatch or approval expiry
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v2/specs/{specId}/convert-to-act:
    post:
      operationId: convertSpecToAct
      summary: Convert an approved spec into a governed Task
      parameters:
        - $ref: "#/components/parameters/SpecId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                expectedRevision:
                  type: integer
                  format: int64
      responses:
        "201":
          description: Conversion result (taskId/fingerprint for the run)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecConversionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/gui/runs/{runId}/command-approval:
    get:
      operationId: getCommandApproval
      summary: Read the pending command approval projection
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Pending command approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingCommandApproval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No pending command approval
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/gui/runs/{runId}/command-approval/{approvalId}:
    post:
      operationId: decideCommandApproval
      summary: Decide a pending command approval (fingerprint-guarded)
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandApprovalDecision"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
