            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceExecutionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
