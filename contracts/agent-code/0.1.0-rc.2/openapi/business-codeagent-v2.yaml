    EvidenceLayer:
      type: string
      enum:
        - SOURCE
        - DETERMINISTIC_TEST
        - PACKAGE
        - RUNTIME
        - LIVE_MODEL
        - TRACE
        - GUI
        - SCENARIO_ORACLE
        - EXECUTION_ACTIVITY
    EvidenceStatus:
      type: string
      enum: [PRESENT, NOT_RUN, FAILED, INCOMPLETE, NOT_APPLICABLE]
    EvidenceItemResponse:
      type: object
      required: [evidenceId, layer, status]
      properties:
        evidenceId:
          type: string
        layer:
          $ref: "#/components/schemas/EvidenceLayer"
        status:
          $ref: "#/components/schemas/EvidenceStatus"
        summary:
          type: object
          additionalProperties: true
    EvidenceBundleResponse:
      type: object
      required: [runId, generatedAt, complete, items]
      properties:
        runId:
          type: string
        generatedAt:
          type: string
        complete:
          type: boolean
          description: True only when every layer is PRESENT or NOT_APPLICABLE.
        items:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceItemResponse"
        stateVersion:
          type: integer
          format: int64
          nullable: true
        artifactsReady:
          type: boolean
          nullable: true
        deliveryStatus:
          type: string
          nullable: true
          enum: [PENDING, AVAILABLE, PARTIAL, UNAVAILABLE]
        changeArtifactRef:
          type: string
          nullable: true
        manifestRef:
          $ref: "#/components/schemas/EvidenceManifestRef"
          nullable: true
        verificationV2:
          type: object
          nullable: true
          additionalProperties: true
        outcomeSeverity:
          type: string
          nullable: true
          enum: [OK, WARNING, ERROR]
    EvidenceManifestRef:
      type: object
      additionalProperties: false
      properties:
        manifestId:
          type: string
        sha256:
          type: string
        stateVersion:
          type: integer
          format: int64
    ModelCatalogEntry:
      type: object
      required: [modelAlias, configured, availability]
      properties:
        providerId:
          type: string
          nullable: true
        protocol:
          type: string
          nullable: true
        providerDisplayName:
          type: string
          nullable: true
        modelAlias:
          type: string
        capabilities:
          type: array
          items:
            type: string
        maxContextLevel:
          type: string
          nullable: true
        contextWindowTokens:
          type: integer
          format: int64
          nullable: true
          description: Physical model context window in tokens.
        contextUsedTokens:
          type: integer
          format: int64
          nullable: true
          description: Latest prompt size reported by the model service.
        cacheHitRatePercent:
          type: number
          format: double
          nullable: true
          description: Average cached-input ratio reported by the model service, as a percentage.
        usageSampleCount:
          type: integer
          format: int64
          nullable: true
          description: Number of model responses contributing to the in-memory usage projection.
        contextTokenOptions:
          type: array
          description: Selectable context budgets declared by the model; clients must not submit arbitrary token values.
          items:
            type: integer
            format: int32
        reasoningEffortOptions:
          type: array
          items:
            type: string
        configured:
          type: boolean
        routePolicyName:
          type: string
          nullable: true
        availability:
          type: string
          enum: [AVAILABLE, UNCONFIGURED, UNAVAILABLE]
    ModelCatalogResponse:
      type: object
      required: [items]
      properties:
        defaultModel:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModelCatalogEntry"
    AgentProfileSummary:
      type: object
      additionalProperties: false
      required: [id, name, description, revision, readonlyResearchDefault]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        revision: { type: string, maxLength: 128 }
        readonlyResearchDefault:
          type: string
          enum: [AUTO, OFF]
        modelSettings:
          $ref: "#/components/schemas/SessionModelSettings"
          nullable: true
    AgentProfileLoadError:
      type: object
      additionalProperties: false
      required: [fileName, code, message]
      properties:
        fileName: { type: string }
        code: { type: string }
        message: { type: string }
    AgentProfilesResponse:
      type: object
      additionalProperties: false
      required: [profiles, loadErrors]
      properties:
        profiles:
          type: array
          items: { $ref: "#/components/schemas/AgentProfileSummary" }
        loadErrors:
          type: array
          items: { $ref: "#/components/schemas/AgentProfileLoadError" }
