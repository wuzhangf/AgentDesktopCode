          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v2/model-catalog:
    get:
      operationId: getModelCatalog
      summary: Public-safe model catalog; never includes credential material
