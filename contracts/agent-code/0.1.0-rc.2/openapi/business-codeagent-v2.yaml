        Services without a persisted change artifact return a typed Problem;
        clients must fail closed and must not fabricate diff rows.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paged diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffPageResponse"
        "501":
          description: Legacy service does not expose the diff projection
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
