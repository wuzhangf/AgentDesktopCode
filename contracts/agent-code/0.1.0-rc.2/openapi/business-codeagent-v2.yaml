          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileReadResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v2/projects/{projectId}/native-open-intents:
    post:
      operationId: createNativeOpenIntent
      summary: |
        Mint a short-lived signed intent (REVEAL | IDE | USER_TERMINAL |
        REVEAL_FILE) for the Electron main to open a native shell for the
        project. The intent expires in 30 seconds and never carries an
        arbitrary executable.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [REVEAL, IDE, USER_TERMINAL, REVEAL_FILE]
                fileRef:
                  type: string
                  nullable: true
                  description: |
                    Server-owned file reference (validated against the run's
                    changedFiles); required for REVEAL_FILE, rejected otherwise.
      responses:
        "201":
          description: Signed intent (returned only to the authenticated main)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativeOpenIntent"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
