        "200":
          description: Model catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCatalogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v2/agent-profiles:
    get:
      operationId: listAgentProfiles
