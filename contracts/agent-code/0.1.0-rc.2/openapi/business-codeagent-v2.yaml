            type: string
          description: Contract directories with edit permission. Applied on the next turn.
        writeForbid:
          type: array
          items:
            type: string
          description: Contract directories retained as read-only context. Applied on the next turn.
        contextDirectories:
          type: array
          items: { type: string, maxLength: 4096 }
          maxItems: 64
          description: User-provided path hints for model context; never a write permission scope.
        directories:
          type: array
          nullable: true
          description: Explicit v2 directory rows. Omitted means unchanged; an empty array clears all rows.
          items: { $ref: "#/components/schemas/SessionDirectory" }
        directoryPolicyVersion:
          type: integer
          nullable: true
          enum: [2]
          description: Required when upgrading a v1 session; optional for an existing v2 session.
        replaceLegacyDirectoryPolicy:
          type: boolean
          nullable: true
          description: Required true when the first v2 list replaces legacy write rules.
        verificationLevel:
          type: string
          nullable: true
        extensions:
          $ref: "#/components/schemas/ExtensionSelection"
          description: |
            Session-level extension default (extension design §4.1). A new
            default only affects the next user message; in-flight
            executions keep their frozen binding.
        maxModelTurns:
          type: integer
          nullable: true
        maxEditAttempts:
          type: integer
          nullable: true
        modelAlias:
          type: string
          nullable: true
          description: EW9 session model policy; must reference a configured catalog entry.
        modelSettings:
          $ref: "#/components/schemas/SessionModelSettings"
          nullable: true
    SessionModelSettings:
      type: object
      additionalProperties: false
      properties:
        providerId:
          type: string
          nullable: true
        modelAlias:
          type: string
          nullable: true
        catalogRevision:
          type: string
          nullable: true
        reasoningMode:
          type: string
          enum: [DEFAULT, OFF, EFFORT, MANUAL_BUDGET]
        reasoningOptionId:
          type: string
          nullable: true
        reasoningBudgetTokens:
          type: integer
          minimum: 1024
          nullable: true
          deprecated: true
          description: Legacy compatibility field; clients must select a reasoning option instead.
        contextMode:
          type: string
          enum: [AUTO, PRESET, CUSTOM]
        contextPresetId:
          type: string
          nullable: true
          description: Selected id from the target model's contextTokenOptions; clients do not enter raw token values.
        contextMaxTokens:
          type: integer
          minimum: 1
          nullable: true
          deprecated: true
          description: Server-resolved value of contextPresetId; clients must select a preset instead.
        outputMode:
          type: string
          enum: [AUTO, CUSTOM]
        outputMaxTokens:
          type: integer
          minimum: 1
          nullable: true
          deprecated: true
          description: Runtime-owned output allocation; not a session user setting.
    SessionModelSettingsPatchRequest:
      type: object
      required: [expectedSettingsRevision, settings]
      additionalProperties: false
      properties:
        expectedSettingsRevision:
          type: integer
          format: int64
          minimum: 0
        applyPolicy:
          type: string
          enum: [NEXT_SAFE_REQUEST]
        settings:
          $ref: "#/components/schemas/SessionModelSettings"
    SessionModelSettingsResponse:
      type: object
      required: [sessionId, settingsRevision, transitionState, desired]
      properties:
        sessionId:
          type: string
        settingsRevision:
          type: integer
          format: int64
        sessionVersion:
          type: integer
          format: int64
        changeId:
          type: string
          nullable: true
        transitionState:
          type: string
          enum: [READY, PENDING, PREPARING, APPLIED, FAILED]
        activeRunId:
          type: string
          nullable: true
        effectiveEpochId:
          type: string
          nullable: true
        lastRequestId:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        desired:
          $ref: "#/components/schemas/SessionModelSettings"
        effective:
          $ref: "#/components/schemas/SessionModelSettings"
    SessionMessageRequest:
      type: object
      required: [clientMessageId, content, expectedSessionVersion]
      properties:
        clientMessageId:
          type: string
        content:
          type: string
        expectedSessionVersion:
          type: integer
          format: int64
          minimum: 1
          description: Session version observed immediately before this message intent.
        extensions:
          $ref: "#/components/schemas/ExtensionSelection"
          description: |
            Per-message extension selection (extension design §4.1).
            Omitted inherits the session setting; an explicit object freezes
            this turn's MCP servers/skills.
        attachments:
          type: array
          maxItems: 4
          description: |
            Multimodal attachments (EW10.1 + 2026-09-08 multimodal design
            7.4/WU-10). Wire whitelist: image/png|jpeg|webp|gif,
            application/pdf, text/plain|markdown. Execution accepts
            text/plain|markdown (TEXT, 256 KiB decoded each) and
            image/png|jpeg (IMAGE, static single frame, 4 MiB decoded each,
            8192 px per side, 16M pixels); the whole message is bounded to
            4 attachments and 8 MiB decoded in total. Request bodies are
            capped at ceil(totalAttachmentBytes/3)*4 + 1 MiB + 64 KiB.
            Exactly one of dataBase64 or sourceAttachmentRef must be
            provided per attachment. Bytes never enter events.
          items:
            type: object
            required: [name, mediaType]
            properties:
              clientAttachmentId:
                type: string
                maxLength: 128
                nullable: true
              name:
                type: string
                maxLength: 200
              mediaType:
                type: string
                enum: [image/png, image/jpeg, image/webp, image/gif,
                       application/pdf, text/plain, text/markdown]
              dataBase64:
                type: string
                description: Base64 payload; mutually exclusive with sourceAttachmentRef.
              detail:
                type: string
                nullable: true
                enum: [AUTO, LOW, HIGH, ORIGINAL]
                description: |
                  Image detail hint (multimodal design 7.4). IMAGE
                  attachments only; default AUTO. Provider-level negotiation
                  happens during request preparation.
              sourceAttachmentRef:
                type: object
                nullable: true
                description: |
                  Re-reference an already accepted IMAGE attachment of the
                  SAME session (multimodal design 7.4). The server resolves
                  authoritative name/MIME/hash/size metadata; the reference
                  still counts toward this message's attachment count and
                  byte budget.
                required: [messageId, attachmentId]
                properties:
                  messageId:
                    type: string
                  attachmentId:
                    type: string
    SessionMessageResponse:
      type: object
      properties:
        messageId:
          type: string
          nullable: true
        clientMessageId:
          type: string
          nullable: true
        taskId:
          type: string
          nullable: true
        runId:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        sessionVersion:
          type: integer
          format: int64
        eventCursor:
          type: integer
          format: int64
        receiptId:
          type: string
          nullable: true
        attachments:
          type: array
          description: Redacted attachment metadata; bytes never appear here.
          items:
            type: object
            properties:
              clientAttachmentId: { type: string, nullable: true }
              attachmentId:
                type: string
                nullable: true
                description: Stable service-derived attachment identity (unique within the message).
              name: { type: string, nullable: true }
              kind:
                type: string
                nullable: true
                enum: [TEXT, IMAGE, DOCUMENT]
                description: TEXT/IMAGE since inputVersion=2; legacy text rows report DOCUMENT.
              mediaType: { type: string, nullable: true }
              sizeBytes: { type: integer, format: int64 }
              width:
                type: integer
                nullable: true
                description: IMAGE only; decoded pixel width.
              height:
                type: integer
                nullable: true
                description: IMAGE only; decoded pixel height.
              detail:
                type: string
                nullable: true
                description: IMAGE only; AUTO/LOW/HIGH/ORIGINAL hint.
              status:
                type: string
                enum: [ACCEPTED, REJECTED]
              reasonCode:
                type: string
                nullable: true
    SourceFetchRequest:
      type: object
      required: [sourceType, uri]
      properties:
        sourceType:
          type: string
          enum: [WEB, ISSUE, DOCS]
          description: |
            EW10.2 source classification recorded in provenance. All three are
            http(s) documents fetched by the same read-only adapter in this
            increment; dedicated per-type adapters stay behind future flags.
        uri:
          type: string
          maxLength: 2048
          description: |
            Absolute http/https URI. Explicit ports, user info and non-public
            hosts are rejected by the service; every redirect hop is
            re-validated.
        maxBytes:
          type: integer
          description: Optional smaller read cap; the 256 KiB service hard cap always wins.
          nullable: true
    SourceFetchResponse:
      type: object
      description: |
        Provenance-carrying read-only source result (design 10.9). Content is
        untrusted data, never system authority; bytes never enter the durable
        journal and URIs are never logged.
      properties:
        sourceType: { type: string, nullable: true }
        sourceUri: { type: string, nullable: true }
        finalUri:
          type: string
          nullable: true
          description: Last URI after redirects; equals sourceUri when no redirect happened.
        fetchedAt: { type: string, nullable: true }
        contentType:
          type: string
          nullable: true
          description: Media type with parameters stripped; text-like types only.
        contentBytes: { type: integer, format: int64, nullable: true }
        contentText:
          type: string
          nullable: true
          description: Decoded text; null when the content type is not text-like.
        truncated: { type: boolean, nullable: true }
        untrustedContent:
          type: boolean
          nullable: true
          description: Always true; UIs must render the payload as plain text with an untrusted marker.
        redirectCount: { type: integer, nullable: true }
        statusCode: { type: integer, nullable: true }
    McpServerSummary:
      type: object
      description: |
        Public-safe MCP server summary (EW10.3). Command, argument and
        environment configuration never leaves the service process.
      properties:
        serverId: { type: string, nullable: true }
        status:
          type: string
          nullable: true
          enum: [READY, UNAVAILABLE, DISABLED]
        reason:
          type: string
          nullable: true
          description: Safe reason code only; never raw stderr or host details.
        resourceCount: { type: integer, nullable: true }
    McpResourceDescriptor:
      type: object
      properties:
        uri: { type: string, nullable: true }
        name: { type: string, nullable: true }
        mimeType: { type: string, nullable: true }
        description: { type: string, nullable: true }
    McpResourceReadRequest:
      type: object
      required: [uri]
      properties:
        uri:
          type: string
          maxLength: 2048
          description: Resource URI as listed by the server; control characters are rejected.
    McpResourceReadResponse:
      type: object
      description: |
        Provenance-carrying read-only MCP resource result (EW10.3). Content
        is untrusted data, never system authority; bytes never enter the
        durable journal and server errors never leak raw stderr.
      properties:
        serverId: { type: string, nullable: true }
        uri: { type: string, nullable: true }
        mimeType: { type: string, nullable: true }
        contentBytes: { type: integer, format: int64, nullable: true }
        contentText:
          type: string
          nullable: true
          description: Decoded text; null when the server returned a binary blob.
        truncated: { type: boolean, nullable: true }
        untrustedContent:
          type: boolean
          nullable: true
          description: Always true; UIs must render the payload as plain text with an untrusted marker.
        fetchedAt: { type: string, nullable: true }
    SkillRegisterRequest:
      type: object
      required: [name, version, source, scope, instructions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        version:
          type: string
          minLength: 1
          maxLength: 32
        source:
          type: string
          minLength: 1
          maxLength: 128
          description: Provenance tag of the author/installer, e.g. builtin or user.
        scope:
          type: string
          enum: [PROJECT, USER]
        projectAlias:
          type: string
          nullable: true
          description: Required when scope is PROJECT; the registered workspace alias.
        instructions:
          type: string
          minLength: 1
          description: Visible instruction body; bounded by the service hard limit.
        permissions:
          type: array
          maxItems: 8
          description: Declared capability tags for the permission preview; advisory in EW10.5.
          items:
            type: string
    SkillRecordResponse:
      type: object
      description: |
        Catalog entry; instructions are visible by design and the catalog
        never executes anything.
      properties:
        skillId: { type: string, nullable: true }
        name: { type: string, nullable: true }
        version: { type: string, nullable: true }
        source: { type: string, nullable: true }
        scope: { type: string, nullable: true, enum: [PROJECT, USER, null] }
        projectAlias: { type: string, nullable: true }
        instructions: { type: string, nullable: true }
        permissions:
          type: array
          items: { type: string }
        status: { type: string, nullable: true, enum: [ACTIVE, DISABLED, REVOKED, null] }
        revision: { type: integer, format: int64, nullable: true }
        createdAt: { type: string, nullable: true }
        updatedAt: { type: string, nullable: true }
    SkillStatusRequest:
      type: object
      required: [status, expectedRevision]
      properties:
        status:
          type: string
          enum: [ACTIVE, DISABLED, REVOKED]
        expectedRevision:
          type: integer
          format: int64
    ExtensionSelection:
      type: object
      description: |
        Per-message or per-session extension selection (extension design
        §4.1). Selection is not an approval: the effective set is the
        intersection with host policy, session mode, grants and the
        current enable state.
      properties:
        mode:
          type: string
          enum: [INHERIT, NONE, EXPLICIT]
          description: |
            INHERIT follows the session setting; NONE disables extensions
            for this scope; EXPLICIT uses exactly the listed references —
            empty arrays mean nothing selected, never "all".
        mcpServers:
          type: array
          items:
            $ref: "#/components/schemas/McpServerSelection"
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillSelection"
        autoSkills:
          type: boolean
          description: M2 automatic candidate activation; default false.
    McpServerSelection:
      type: object
      required: [serverId]
      properties:
        serverId:
          type: string
          pattern: "^[a-z0-9_-]{1,64}$"
        toolIds:
          type: array
          description: Internal stable tool ids admitted this run; empty means none.
          items: { type: string, maxLength: 128 }
        resourcesEnabled:
          type: boolean
          default: false
    SkillSelection:
      type: object
      required: [skillId, versionDigest]
      properties:
        skillId:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,128}$"
        versionDigest:
          type: string
          description: Immutable package digest (e.g. sha256:...); the frozen version for this run.
          pattern: "^[A-Za-z0-9:._-]{1,128}$"
    McpServerConfigRequest:
      type: object
      required: [displayName, scope, transport]
      description: |
        Server configuration. The body never carries credential material;
        envKeys/headerKeys are slot NAMES resolved against the host
        credential store at launch, not values.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        scope:
          type: string
          enum: [USER, PROJECT]
        projectId:
          type: string
          nullable: true
          description: Required when scope is PROJECT.
        enabled:
          type: boolean
          default: true
        protocolPolicy:
          type: string
          enum: [AUTO, PIN]
          default: PIN
          description: PIN uses only protocolProfile; AUTO (M3) probes across eras.
        protocolProfile:
          type: string
          nullable: true
          enum: [LEGACY_2024_11_05, LEGACY_2025_11_25, MODERN_2026_07_28, null]
        transport:
          $ref: "#/components/schemas/McpTransportConfig"
        credentialRef:
          type: string
          nullable: true
          maxLength: 128
          description: Credential slot name in the host store; never the value.
        policyRef:
          type: string
          nullable: true
          maxLength: 128
          description: Server-managed risk policy reference.
    McpTransportConfig:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [STDIO, STREAMABLE_HTTP]
        executable:
          type: string
          nullable: true
          maxLength: 512
          description: STDIO executable; passed to ProcessBuilder argv[0], never through a shell.
        args:
          type: array
          maxItems: 32
          description: STDIO argv elements verbatim; no shell splitting or re-expansion.
          items: { type: string, maxLength: 4096 }
        cwd:
          type: string
          nullable: true
          maxLength: 4096
          description: Verified working directory for STDIO launches.
        envKeys:
          type: array
          maxItems: 32
          description: |
            Names of host credential-store slots whose values are injected
            into the child environment at launch. Values never travel this API.
          items: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
        endpoint:
          type: string
          nullable: true
          maxLength: 2048
          description: STREAMABLE_HTTP endpoint; HTTPS required outside explicit loopback dev profiles.
        headerKeys:
          type: array
          maxItems: 16
          description: Host credential-store slot names bound to outbound headers.
          items: { type: string, maxLength: 128 }
        connectTimeoutMillis:
          type: integer
          format: int64
          nullable: true
        callTimeoutMillis:
          type: integer
          format: int64
          nullable: true
    McpServerUpdateRequest:
      type: object
      required: [expectedRevision]
      properties:
        displayName:
          type: string
          nullable: true
          maxLength: 128
        enabled:
          type: boolean
          nullable: true
        protocolPolicy:
          type: string
          nullable: true
          enum: [AUTO, PIN, null]
        protocolProfile:
          type: string
          nullable: true
          enum: [LEGACY_2024_11_05, LEGACY_2025_11_25, MODERN_2026_07_28, null]
        transport:
          $ref: "#/components/schemas/McpTransportConfig"
          nullable: true
        credentialRef:
          type: string
          nullable: true
          maxLength: 128
        policyRef:
          type: string
          nullable: true
          maxLength: 128
        expectedRevision:
          type: integer
          format: int64
          description: Optimistic concurrency token; EXT_REVISION_CONFLICT on mismatch.
    McpServerStatusRequest:
      type: object
      required: [enabled, expectedRevision]
      properties:
        enabled:
          type: boolean
        expectedRevision:
          type: integer
          format: int64
    McpServerDetailResponse:
      type: object
      description: |
        Public-safe server detail (extension design §5.1). Configuration is
        redacted: executable/args are summarized by digest and counts,
        credentialRef is reported as a slot presence flag only.
      properties:
        serverId: { type: string, nullable: true }
        displayName: { type: string, nullable: true }
        scope: { type: string, nullable: true, enum: [USER, PROJECT, OPERATOR, null] }
        projectId: { type: string, nullable: true }
        transportKind: { type: string, nullable: true, enum: [STDIO, STREAMABLE_HTTP, null] }
        enabled: { type: boolean, nullable: true }
        revision: { type: integer, format: int64, nullable: true }
        configDigest: { type: string, nullable: true }
        connectionState:
          type: string
          nullable: true
          enum: [DISABLED, STOPPED, CONNECTING, READY, AUTH_REQUIRED, DEGRADED, FAILED, UNSUPPORTED, null]
        stateReason:
          type: string
          nullable: true
          description: Stable reason code only; never stderr or host detail.
        protocolProfile: { type: string, nullable: true }
        toolCount: { type: integer, nullable: true }
        resourceCount: { type: integer, nullable: true }
        promptCount: { type: integer, nullable: true }
        hasCredential: { type: boolean, nullable: true }
        lastReadyAt: { type: string, nullable: true }
        createdAt: { type: string, nullable: true }
        updatedAt: { type: string, nullable: true }
    McpConnectionActionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [CONNECT, TEST, DISCONNECT, RESTART]
    McpOperationResponse:
      type: object
      properties:
        operationId: { type: string, nullable: true }
        serverId: { type: string, nullable: true }
        kind: { type: string, nullable: true, enum: [CONNECT, TEST, DISCONNECT, RESTART, CATALOG_REFRESH, AUTH, null] }
        status: { type: string, nullable: true, enum: [RUNNING, SUCCEEDED, FAILED, CANCELLED, null] }
        detail: { type: string, nullable: true }
        createdAt: { type: string, nullable: true }
        finishedAt: { type: string, nullable: true }
    McpToolDescriptorView:
      type: object
      description: |
        One catalogued MCP tool. Annotations are UI hints only — they never
        grant read/write or idempotent rights (extension design §5.4).
      properties:
        toolId: { type: string, nullable: true, description: Stable internal registration id. }
        rawName: { type: string, nullable: true, description: Server-reported name, case preserved. }
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        inputSchema:
          type: object
          nullable: true
          additionalProperties: true
        outputSchema:
          type: object
          nullable: true
          additionalProperties: true
        annotations:
          type: object
          nullable: true
          additionalProperties: true
        schemaDigest: { type: string, nullable: true }
        effectiveRisk: { type: string, nullable: true, enum: [READ_ONLY, WRITE, EXTERNAL_EFFECT, HIGH_RISK, null] }
        availability: { type: string, nullable: true, enum: [AVAILABLE, DISABLED, UNAVAILABLE, DEGRADED, null] }
        availabilityReason: { type: string, nullable: true }
    McpToolListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/McpToolDescriptorView"
        nextCursor: { type: string, nullable: true }
        catalogRevision: { type: integer, format: int64, nullable: true }
        cached: { type: boolean, nullable: true }
    McpResourceTemplateView:
      type: object
      properties:
        uriTemplate: { type: string, nullable: true }
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        mimeType: { type: string, nullable: true }
    McpResourceTemplateListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/McpResourceTemplateView"
        nextCursor: { type: string, nullable: true }
    McpPromptDescriptorView:
      type: object
      properties:
        name: { type: string, nullable: true }
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        arguments:
          type: array
          nullable: true
          items:
            type: object
            properties:
              name: { type: string, nullable: true }
              description: { type: string, nullable: true }
              required: { type: boolean, nullable: true }
    McpPromptListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/McpPromptDescriptorView"
        nextCursor: { type: string, nullable: true }
    McpPromptResolveRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 256
        arguments:
          type: object
          nullable: true
          additionalProperties: { type: string }
    McpPromptResolveResponse:
      type: object
      properties:
        promptName: { type: string, nullable: true }
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/ExtensionContentBlock"
        provenance: { type: string, nullable: true }
    McpAuthActionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [START, CANCEL, REVOKE]
    McpAuthActionResponse:
      type: object
      properties:
        operationId: { type: string, nullable: true }
        status:
          type: string
          nullable: true
          enum: [PENDING, AUTH_REQUIRED, CANCELLED, REVOKED, COMPLETED, FAILED, null]
        loginUrl:
          type: string
          nullable: true
          description: Host-generated user-consent URL opened by the desktop shell; expires quickly.
    ExtensionContentBlock:
      type: object
      description: |
        Normalized external content block (extension design §5.6). Text
        payloads are bounded; large or binary payloads are carried by
        artifactRef only.
      properties:
        kind:
          type: string
          nullable: true
          enum: [TEXT, STRUCTURED, IMAGE_REF, AUDIO_REF, RESOURCE_LINK, EMBEDDED_RESOURCE, null]
        mimeType: { type: string, nullable: true }
        text: { type: string, nullable: true }
        artifactRef: { type: string, nullable: true }
        sourceRef: { type: string, nullable: true }
        sha256: { type: string, nullable: true }
        originalBytes: { type: integer, format: int64, nullable: true }
        includedBytes: { type: integer, format: int64, nullable: true }
        truncated: { type: boolean, nullable: true }
        dataClassification: { type: string, nullable: true, enum: [PUBLIC_SAFE, EXTERNAL_UNTRUSTED, SENSITIVE, null] }
    SkillSummaryResponse:
      type: object
      description: |
        Lightweight catalog row (view=SUMMARY): no instruction body, used
        for large catalogs. Selection still needs the digest-pinned detail.
      properties:
        skillId: { type: string, nullable: true }
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        scope: { type: string, nullable: true, enum: [PROJECT, USER, BUILTIN, null] }
        projectAlias: { type: string, nullable: true }
        status: { type: string, nullable: true, enum: [ACTIVE, DISABLED, REVOKED, NEEDS_METADATA, null] }
        currentVersionDigest: { type: string, nullable: true }
        versionCount: { type: integer, nullable: true }
        revision: { type: integer, format: int64, nullable: true }
        permissionHints:
          type: array
          nullable: true
          items: { type: string }
        updatedAt: { type: string, nullable: true }
    SkillVersionView:
      type: object
      properties:
        versionId: { type: string, nullable: true }
        packageDigest: { type: string, nullable: true }
        format: { type: string, nullable: true, enum: [STANDARD_PACKAGE, LEGACY_INLINE, null] }
        displayVersion: { type: string, nullable: true, description: metadata.version or short digest. }
        importedAt: { type: string, nullable: true }
        fileCount: { type: integer, nullable: true }
        entryBytes: { type: integer, format: int64, nullable: true }
        sourceSummary: { type: string, nullable: true }
    SkillDiagnostic:
      type: object
      properties:
        code: { type: string, nullable: true }
        severity: { type: string, nullable: true, enum: [INFO, WARN, ERROR, null] }
        message: { type: string, nullable: true }
        path: { type: string, nullable: true }
    SkillDetailResponse:
      type: object
      properties:
        skillId: { type: string, nullable: true }
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        scope: { type: string, nullable: true, enum: [PROJECT, USER, BUILTIN, null] }
        projectAlias: { type: string, nullable: true }
        status: { type: string, nullable: true, enum: [ACTIVE, DISABLED, REVOKED, NEEDS_METADATA, null] }
        revision: { type: integer, format: int64, nullable: true }
        currentVersion:
          $ref: "#/components/schemas/SkillVersionView"
          nullable: true
        versions:
          type: array
          items:
            $ref: "#/components/schemas/SkillVersionView"
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/SkillDiagnostic"
        permissionHints:
          type: array
          description: Advisory only; never an approval grant.
          items: { type: string }
        createdAt: { type: string, nullable: true }
        updatedAt: { type: string, nullable: true }
    SkillVersionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SkillVersionView"
    SkillManifestFile:
      type: object
      properties:
        path: { type: string, nullable: true, description: Package-relative path; never a host path. }
        sha256: { type: string, nullable: true }
        bytes: { type: integer, format: int64, nullable: true }
        kind: { type: string, nullable: true, enum: [ENTRY, REFERENCE, SCRIPT, ASSET, OTHER, null] }
    SkillManifestResponse:
      type: object
      properties:
        skillId: { type: string, nullable: true }
        versionId: { type: string, nullable: true }
        packageDigest: { type: string, nullable: true }
        frontmatter:
          type: object
          nullable: true
          additionalProperties: true
        files:
          type: array
          items:
            $ref: "#/components/schemas/SkillManifestFile"
    SkillImportSourceRequest:
      type: object
      required: [rootHint]
      properties:
        rootHint:
          type: string
          maxLength: 4096
          description: |
            Opaque handle text produced by the trusted main-process
            directory picker — NOT a renderer-supplied path. The host
            re-validates the canonical root before scanning.
        displayName:
          type: string
          nullable: true
          maxLength: 256
    SkillImportSourceResponse:
      type: object
      properties:
        sourceHandle: { type: string, nullable: true, description: Short-lived opaque handle bound to principal/purpose. }
        expiresAt: { type: string, nullable: true }
        rootDigest: { type: string, nullable: true }
    SkillImportPreviewRequest:
      type: object
      required: [sourceHandle]
      properties:
        sourceHandle:
          type: string
          maxLength: 256
    SkillImportPreviewEntry:
      type: object
      properties:
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        relativePath: { type: string, nullable: true }
        fileCount: { type: integer, nullable: true }
        totalBytes: { type: integer, format: int64, nullable: true }
        scriptPaths:
          type: array
          items: { type: string }
        permissionHints:
          type: array
          items: { type: string }
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/SkillDiagnostic"
    SkillImportPreviewResponse:
      type: object
      properties:
        previewId: { type: string, nullable: true }
        sourceDigest: { type: string, nullable: true }
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SkillImportPreviewEntry"
        expiresAt: { type: string, nullable: true }
    SkillImportRequest:
      type: object
      required: [previewId, expectedSourceDigest, scope]
      properties:
        previewId:
          type: string
          maxLength: 128
        expectedSourceDigest:
          type: string
          maxLength: 128
          description: Re-validated against the live root; mismatch means the tree changed after preview.
        scope:
          type: string
          enum: [PROJECT, USER]
        projectAlias:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
          maxLength: 100
          description: Optional rename for same-name disambiguation.
    SkillVersionSelectRequest:
      type: object
      required: [versionDigest, expectedRevision]
      properties:
        versionDigest:
          type: string
          pattern: "^[A-Za-z0-9:._-]{1,128}$"
        expectedRevision:
          type: integer
          format: int64
    ExtensionBindingView:
      type: object
      description: |
        Frozen per-execution binding evidence (extension design §4.2).
        Records what was selected and loaded; not a claim the model obeyed.
      properties:
        bindingId: { type: string, nullable: true }
        executionId: { type: string, nullable: true }
        revision: { type: integer, format: int64, nullable: true }
        snapshotDigest: { type: string, nullable: true }
        createdAt: { type: string, nullable: true }
        servers:
          type: array
          items:
            type: object
            properties:
              serverId: { type: string, nullable: true }
              toolIds:
                type: array
                items: { type: string }
              catalogDigest: { type: string, nullable: true }
        skills:
          type: array
          items:
            type: object
            properties:
              skillId: { type: string, nullable: true }
              versionDigest: { type: string, nullable: true }
              state:
                type: string
                nullable: true
                enum: [DISCOVERED, SELECTED, LOADED, INCLUDED, FAILED, null]
              selectionReason: { type: string, nullable: true }
              includedRequestId: { type: string, nullable: true }
    ExecutionExtensionsResponse:
      type: object
      properties:
        executionId: { type: string, nullable: true }
        binding:
          $ref: "#/components/schemas/ExtensionBindingView"
          nullable: true
        invocationsCursor:
          type: string
          nullable: true
          description: Start cursor for the extension-invocations listing.
    ExtensionInvocationView:
      type: object
      description: |
        One governed extension call. UNKNOWN means the external effect could
        not be confirmed; it is never silently retried (design §7.2).
      properties:
        invocationId: { type: string, nullable: true }
        executionId: { type: string, nullable: true }
        bindingId: { type: string, nullable: true }
        bindingRevision: { type: integer, format: int64, nullable: true }
        kind: { type: string, nullable: true, enum: [MCP_TOOL, SKILL_SCRIPT, MCP_RESOURCE, MCP_PROMPT, null] }
        target:
          type: object
          nullable: true
          properties:
            serverId: { type: string, nullable: true }
            toolId: { type: string, nullable: true }
            skillId: { type: string, nullable: true }
            scriptPath: { type: string, nullable: true }
        state:
          type: string
          nullable: true
          enum: [PREPARED, WAITING_APPROVAL, AUTHORIZED, DISPATCHING, WAITING_INPUT, SUCCEEDED, FAILED, UNKNOWN, CANCELLED, DENIED, null]
        effectOutcome:
          type: string
          nullable: true
          enum: [NONE, CONFIRMED, POSSIBLE, UNSPECIFIED, null]
        approvalId: { type: string, nullable: true }
        result:
          type: object
          nullable: true
          properties:
            contentRef: { type: string, nullable: true }
            contentDigest: { type: string, nullable: true }
            preview: { type: string, nullable: true, description: Redacted, bounded result preview. }
            truncated: { type: boolean, nullable: true }
        evidence:
          type: object
          nullable: true
          properties:
            modelRequestId: { type: string, nullable: true }
            providerToolCallId: { type: string, nullable: true }
        errorCode: { type: string, nullable: true }
        attempts: { type: integer, nullable: true }
        createdAt: { type: string, nullable: true }
        updatedAt: { type: string, nullable: true }
    ExtensionInvocationListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExtensionInvocationView"
        nextCursor: { type: string, nullable: true }
    ExtensionTestExecutionRequest:
      type: object
      required: [extensions]
      properties:
        extensions:
          $ref: "#/components/schemas/ExtensionSelection"
        sessionId:
          type: string
          nullable: true
          description: Optional session the test execution reports against.
        arguments:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Tool arguments for the test call — validated against the bound
            tool's inputSchema exactly like a model-driven invocation.
        budgetTokens:
          type: integer
          nullable: true
          description: Optional context budget override for the test run.
    ExtensionTestExecutionResponse:
      type: object
      properties:
        executionId: { type: string, nullable: true }
        status: { type: string, nullable: true, enum: [RUNNING, COMPLETED, FAILED, null] }
        bindingId: { type: string, nullable: true }
    HookSummary:
      type: object
      description: |
        Public-safe hook summary (EW10.6). Command, argument and environment
        configuration of the operator allowlist never leaves the service.
      properties:
        name: { type: string, nullable: true }
        event:
          type: string
          nullable: true
          enum: [RUN_QUEUED, RUN_STARTED, RUN_TERMINAL, null]
        enabled: { type: boolean, nullable: true }
        timeoutMillis: { type: integer, nullable: true }
        failurePolicy: { type: string, nullable: true, enum: [LOG_ONLY, IGNORE, null] }
        lastStatus: { type: string, nullable: true, enum: [OK, FAILED, TIMEOUT, null] }
        lastFinishedAt: { type: string, nullable: true }
    HookExecutionRecord:
      type: object
      description: Status, duration and identity only — never hook stdin, stdout or host details.
      properties:
        hookName: { type: string, nullable: true }
        event: { type: string, nullable: true }
        eventId: { type: string, nullable: true }
        status: { type: string, nullable: true, enum: [OK, FAILED, TIMEOUT, SKIPPED, null] }
        durationMillis: { type: integer, format: int64, nullable: true }
        finishedAt: { type: string, nullable: true }
    HookExecutionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HookExecutionRecord"
        truncated:
          type: boolean
          description: True when older executions were dropped by the bounded ring.
    SessionForkRequest:
      type: object
      required: [expectedSessionVersion]
      properties:
        expectedSessionVersion:
          type: integer
          format: int64
        copyPolicy:
          type: string
          enum: [MESSAGES_ONLY, MESSAGES_AND_SETTINGS, MESSAGES_ONLY_READ_ONLY, FORK_SNAPSHOT]
        title:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        forkPoint:
          type: object
          nullable: true
          properties:
            messageId:
              type: string
              nullable: true
            eventId:
              type: string
              nullable: true
    SessionArchiveRequest:
      type: object
      required: [expectedSessionVersion]
      properties:
        expectedSessionVersion:
          type: integer
          format: int64
        reason:
          type: string
          nullable: true
    SessionSummaryResponse:
      type: object
      description: Lightweight session row (2026-09-05 history pagination design §5.2); never a SessionResponse subclass.
      required: [sessionId, sessionVersion, readRevision, status, interactionMode, createdAt, updatedAt, activeRunObservation, eventCursor]
      properties:
        sessionId: { type: string }
        sessionVersion: { type: integer, format: int64 }
        readRevision: { type: string, description: Session read-model version, decimal string }
        title: { type: string, nullable: true }
        workspaceAlias: { type: string, nullable: true }
        agentProfileId: { type: string, nullable: true }
        agentProfileName: { type: string, nullable: true }
        agentProfileRevision: { type: string, nullable: true }
        status: { type: string }
        interactionMode: { type: string }
        intent:
          type: string
          nullable: true
          enum: [ASK, REVIEW, EXPLAIN, DESIGN, IMPLEMENT]
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        archivedAt: { type: integer, format: int64, nullable: true }
        activeRunId: { type: string, nullable: true }
        activeRunObservation: { type: string, enum: [KNOWN, UNKNOWN] }
        eventCursor: { type: integer, format: int64 }
    SessionSummaryPageResponse:
      type: object
      required: [schemaVersion, serviceInstanceId, items, nextCursor, hasMore, snapshotRevision, consistency]
      properties:
        schemaVersion: { type: string, enum: [session-summary-page/1] }
        serviceInstanceId: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/SessionSummaryResponse" }
        nextCursor: { type: string, nullable: true, description: Opaque signed token; null exactly when enumeration ended }
        hasMore: { type: boolean }
        snapshotRevision: { type: string, description: Read version validated for THIS page; not an MVCC snapshot }
        consistency: { type: string, enum: [REVISION_VALIDATED] }
    SessionMetadataResponse:
      type: object
      description: Session contract/status projection without a messages field.
      required: [sessionId, sessionVersion, status, interactionMode, createdAt, updatedAt, activeRunObservation, eventCursor, readRevision, transcriptRevision]
      properties:
        schemaVersion: { type: string, nullable: true }
        sessionId: { type: string }
        sessionVersion: { type: integer, format: int64 }
        title: { type: string, nullable: true }
        workspaceAlias: { type: string, nullable: true }
        workspaceId: { type: string, nullable: true }
        workspaceLineageId: { type: string, nullable: true }
        agentProfileId: { type: string, nullable: true }
        agentProfileName: { type: string, nullable: true }
        agentProfileRevision: { type: string, nullable: true }
        interactionMode: { type: string }
        intent:
          type: string
          nullable: true
          enum: [ASK, REVIEW, EXPLAIN, DESIGN, IMPLEMENT]
        executionMode: { type: string }
        autonomyLevel: { type: string }
        permissionMode:
          type: string
          nullable: true
          enum: [WORKSPACE, FULL_ACCESS]
          description: Independent session permission contract; FULL_ACCESS is not an interaction mode.
        policyFingerprint: { type: string, nullable: true }
        contextRevision: { type: integer, format: int64 }
        parentSessionId: { type: string, nullable: true }
        forkPointMessageId: { type: string, nullable: true }
        forkPointEventId: { type: string, nullable: true }
        forkReason: { type: string, nullable: true }
        activeRunId: { type: string, nullable: true }
        pendingCommandApproval:
          $ref: "#/components/schemas/PendingCommandApproval"
          nullable: true
        activeRunObservation: { type: string, enum: [KNOWN, UNKNOWN] }
        status: { type: string }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        archivedAt: { type: integer, format: int64, nullable: true }
        writeAllow: { type: array, items: { type: string } }
        writeForbid: { type: array, items: { type: string } }
        contextDirectories: { type: array, maxItems: 64, items: { type: string, maxLength: 4096 } }
        directoryPolicyVersion: { type: integer, enum: [1, 2] }
        directories: { type: array, items: { $ref: "#/components/schemas/SessionDirectory" } }
        directoryAccess: { $ref: "#/components/schemas/DirectoryAccess", nullable: true }
        verificationLevel: { type: string }
        maxModelTurns: { type: integer }
        maxEditAttempts: { type: integer }
        eventCursor: { type: integer, format: int64 }
        modelAlias: { type: string, nullable: true }
        readRevision: { type: string }
        transcriptRevision: { type: string }
    AttachmentSummaryResponse:
      type: object
      properties:
        id: { type: string, nullable: true }
        name: { type: string, nullable: true }
        kind:
          type: string
          nullable: true
          enum: [TEXT, IMAGE]
          description: Attachment kind since inputVersion=2 (multimodal design 7.3); null on legacy rows.
        mediaType: { type: string, nullable: true }
        sizeBytes: { type: integer, format: int64, nullable: true }
        sha256: { type: string, nullable: true }
        width: { type: integer, nullable: true, description: IMAGE only; decoded pixel width. }
        height: { type: integer, nullable: true, description: IMAGE only; decoded pixel height. }
    SessionDirectory:
      type: object
      additionalProperties: false
      required: [id, path, writeEnabled]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        path: { type: string, minLength: 1, maxLength: 4096 }
        writeEnabled: { type: boolean }
    DirectoryAccess:
      type: object
      properties:
        savedSessionVersion: { type: integer, format: int64 }
        savedWriteMode: { type: string, enum: [NONE, ROOTS, ALL] }
        entries:
          type: array
          items: { $ref: "#/components/schemas/DirectoryAccessEntry" }
        activeTurn:
          $ref: "#/components/schemas/DirectoryAccessActiveTurn"
          nullable: true
    DirectoryAccessEntry:
      type: object
      properties:
        id: { type: string }
        writable: { type: boolean }
        reason: { type: string, enum: [DIRECT, ANCESTOR, READ_ONLY_SESSION, NOT_GRANTED, FULL_ACCESS, DEFAULT_WORKSPACE] }
        immutable: { type: boolean }
        coveredByDirectoryId: { type: string, nullable: true }
    DirectoryAccessActiveTurn:
      type: object
      properties:
        runId: { type: string }
        sessionVersion: { type: integer, format: int64 }
        writeMode: { type: string, enum: [NONE, ROOTS, ALL] }
        scopeHash: { type: string }
    SessionHistoryMessageResponse:
      type: object
      required: [id, clientMessageId, role, status, createdAt, updatedAt, contentRevision, contentState, contentBytes]
      properties:
        id: { type: string }
        clientMessageId: { type: string }
        role: { type: string }
        status: { type: string }
        taskId: { type: string, nullable: true }
        runId: { type: string, nullable: true }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        contentRevision: { type: string, description: Independent revision of THIS body, decimal string }
        content: { type: string, nullable: true, description: Present only when contentState=INLINE }
        contentPreview: { type: string, nullable: true, description: Present only when contentState=DEFERRED }
        contentState: { type: string, enum: [INLINE, DEFERRED] }
        contentBytes: { type: integer, format: int64 }
        reasoning:
          type: string
          nullable: true
          description: |
            Provider-returned display reasoning for this assistant turn
            (design 2026-09-18). Bounded plain text; absent when the
            provider returned none or the turn predates the feature.
            Run-scoped turns carry reasoning on /runs/{runId}/reasoning.
        reasoningTruncated:
          type: boolean
          nullable: true
          description: True when the stored reasoning hit a capture bound
        attachments:
          type: array
          items: { $ref: "#/components/schemas/AttachmentSummaryResponse" }
    SessionMessagePageResponse:
      type: object
      required: [schemaVersion, sessionId, transcriptRevision, items, beforeCursor, afterCursor, hasOlder, hasNewer, rangeComplete]
      properties:
        schemaVersion: { type: string, enum: [session-message-page/1] }
        sessionId: { type: string }
        transcriptRevision: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/SessionHistoryMessageResponse" }
        beforeCursor: { type: string, nullable: true }
        afterCursor: { type: string, nullable: true }
        hasOlder: { type: boolean }
        hasNewer: { type: boolean, description: False on a fresh tail page only for this transcriptRevision }
        rangeComplete: { type: boolean, description: This page's declared range was delivered whole; not a whole-transcript claim }
    MessageContentPageResponse:
      type: object
      required: [schemaVersion, sessionId, messageId, contentRevision, text, nextCursor, hasMore, complete, totalBytes]
      properties:
        schemaVersion: { type: string, enum: [message-content-page/1] }
        sessionId: { type: string }
        messageId: { type: string }
        contentRevision: { type: string }
        text: { type: string }
        nextCursor: { type: string, nullable: true }
        hasMore: { type: boolean }
        complete: { type: boolean }
        totalBytes: { type: integer, format: int64 }
    SessionResponse:
      type: object
      required: [sessionId, sessionVersion]
      properties:
        schemaVersion:
          type: string
        sessionId:
          type: string
        sessionVersion:
          type: integer
          format: int64
        title:
          type: string
          nullable: true
        workspaceAlias:
          type: string
          nullable: true
        workspaceId:
          type: string
          nullable: true
        workspaceLineageId:
          type: string
          nullable: true
        agentProfileId:
          type: string
          nullable: true
        agentProfileName:
          type: string
          nullable: true
        agentProfileRevision:
          type: string
          nullable: true
        readonlyResearchMode:
          type: string
          nullable: true
          enum: [AUTO, OFF]
        readonlyResearchEnabled:
          type: boolean
          nullable: true
        readonlyResearchReasonCode:
          type: string
          nullable: true
        initialWorkspaceListing:
          type: boolean
          nullable: true
        interactionMode:
          type: string
          nullable: true
        intent:
          type: string
          nullable: true
          enum: [ASK, REVIEW, EXPLAIN, DESIGN, IMPLEMENT]
        executionMode:
          type: string
          nullable: true
        autonomyLevel:
          type: string
          nullable: true
        permissionMode:
          type: string
          nullable: true
          enum: [WORKSPACE, FULL_ACCESS]
          description: Independent contract override. FULL_ACCESS is not a third interaction mode.
        modelAlias:
          type: string
          nullable: true
        modelSettingsRevision:
          type: integer
          format: int64
        modelSettingsState:
          type: string
          enum: [READY, PENDING, PREPARING, APPLIED, FAILED]
        modelSettings:
          $ref: "#/components/schemas/SessionModelSettings"
          nullable: true
        policyFingerprint:
          type: string
          nullable: true
        contextRevision:
          type: integer
          format: int64
        parentSessionId:
          type: string
          nullable: true
        forkPointMessageId:
          type: string
          nullable: true
        forkPointEventId:
          type: string
          nullable: true
        forkReason:
          type: string
          nullable: true
        activeRunId:
          type: string
          nullable: true
        pendingCommandApproval:
          $ref: "#/components/schemas/PendingCommandApproval"
          nullable: true
        status:
          type: string
          nullable: true
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
        archivedAt:
          type: integer
          format: int64
          nullable: true
        writeAllow:
          type: array
          items:
            type: string
        writeForbid:
          type: array
          items:
            type: string
        contextDirectories:
          type: array
          maxItems: 64
          items: { type: string, maxLength: 4096 }
        directoryPolicyVersion: { type: integer, enum: [1, 2] }
        directories: { type: array, items: { $ref: "#/components/schemas/SessionDirectory" } }
        directoryAccess: { $ref: "#/components/schemas/DirectoryAccess", nullable: true }
        verificationLevel:
          type: string
          nullable: true
        maxModelTurns:
          type: integer
        maxEditAttempts:
          type: integer
        workspaceBinding:
          $ref: "#/components/schemas/WorkspaceBindingResponse"
          nullable: true
        messages:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              clientMessageId:
                type: string
                nullable: true
              role:
                type: string
              content:
                type: string
              status:
                type: string
                nullable: true
              taskId:
                type: string
                nullable: true
              runId:
                type: string
                nullable: true
              reasoning:
                type: string
                nullable: true
                description: |
                  Provider-returned display reasoning for ordinary-chat
                  assistant turns (design 2026-09-18). Bounded public text
                  only; run-scoped turns carry reasoning on
                  /runs/{runId}/reasoning.
              reasoningTruncated:
                type: boolean
                nullable: true
                description: True when the stored reasoning hit a capture bound
              attachments:
                type: array
                nullable: true
                description: Attachment light projection (id/name/mediaType/sizeBytes/sha256; no textContent).
                items:
                  type: object
                  properties:
                    id: { type: string, nullable: true }
                    name: { type: string, nullable: true }
                    mediaType: { type: string, nullable: true }
                    sizeBytes: { type: integer, format: int64, nullable: true }
                    sha256: { type: string, nullable: true }
              createdAt:
                type: integer
                format: int64
              updatedAt:
                type: integer
                format: int64
        eventCursor:
          type: integer
          format: int64
    AttentionItem:
      type: object
      properties:
        attentionId:
          type: string
        sourceType:
          type: string
          nullable: true
        sourceId:
          type: string
          nullable: true
        sourceVersion:
          type: integer
          format: int64
        sessionId:
          type: string
          nullable: true
        missionId:
          type: string
          nullable: true
        attentionType:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        fingerprint:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        decisionEndpoint:
          type: string
          nullable: true
        createdAt:
          type: string
          nullable: true
        resolvedAt:
          type: string
          nullable: true
    Problem:
      type: object
      description: |
        Actual wire shape of v2 problems: {code, status, message} plus
        flattened detail fields. The `code` is the only stable contract for
        UIs; `message` is human-readable diagnostics.
      required: [code, status, message]
      properties:
        code:
          type: string
        status:
          type: integer
        message:
          type: string
        failure:
          $ref: "#/components/schemas/FailureDescriptorResponse"
          nullable: true
      additionalProperties: true
    ExecutionBackendStatusResponse:
      type: object
      required: [snapshotVersion, snapshotId, generation, backends]
      properties:
        snapshotVersion: { type: string }
        snapshotId: { type: string }
        catalogFingerprint: { type: string, nullable: true }
        generation: { type: integer, format: int64, minimum: 0 }
        observedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        reasonCode: { type: string, nullable: true }
        safeReason: { type: string, nullable: true }
        backends:
          type: array
          items:
            type: object
            required: [id, type, availability, isolationLevel]
            properties:
              id: { type: string }
              type: { type: string }
              availability: { type: string }
              isolationLevel: { type: string }
              reasonCode: { type: string, nullable: true }
              safeReason: { type: string, nullable: true }
    CapabilityResponse:
      type: object
      required: [serviceInstanceId, protocolVersion, minDesktopProtocol, features, limits, operations]
      properties:
        serviceInstanceId:
          type: string
        storeId:
          type: string
          nullable: true
          description: Stable identity of the service state store; changes only when the store is replaced.
        bootId:
          type: string
          nullable: true
          description: Process boot identity; changes on every Service restart.
        protocolVersion:
          type: string
          example: "2.1"
        minDesktopProtocol:
          type: string
          example: "2.0"
        build:
          type: object
          properties:
            business:
              type: string
              nullable: true
            productCode:
              type: string
              nullable: true
            productPlan:
              type: string
              nullable: true
            framework:
              type: string
              nullable: true
            foundation:
              type: string
              nullable: true
        features:
          type: object
          properties:
            sessionV2:
              type: boolean
            durableEvents:
              type: boolean
            visibleOutputStream:
              type: boolean
            reviewScopes:
              type: array
              items:
                type: string
                enum: [LAST_TURN, RUN, WORKING_TREE, STAGED, COMMIT, BRANCH]
            worktreeExecution:
              type: boolean
            mission:
              type: boolean
            readOnlySources:
              type: boolean
              description: |
                EW10.2 read-only Web/issue/docs source adapter (design 10.9).
                Off by default; enabling requires the source threat-model
                gates. Fetched content is always untrusted data.
            mcpReadOnlySource:
              type: boolean
              description: |
                EW10.3 read-only MCP resource source (design 10.6). Off by
                default; servers come from the service-side allowlist only,
                resources/list and resources/read only, content is always
                untrusted data. Mutating MCP tools stay behind mcpHost.
            skillsCatalog:
              type: boolean
              description: |
                EW10.5 skill catalog (design 10.6). Off by default; the
                catalog only registers, lists and gates skills — it never
                executes them.
            hooks:
              type: boolean
              description: |
                EW10.6 typed hooks (design 10.6). Off by default; hooks are
                operator-allowlisted lifecycle observers with fixed events,
                typed input, timeouts and a never-blocks-the-run failure
                policy. No arbitrary implicit shell.
            readOnlySubagent:
              type: boolean
              description: |
                Read-only research/plan subagent capability. Off by default;
                enabling requires the EW8 subagent contract gates.
            readOnlySubagentAvailability:
              type: string
              enum: [NONE, WORKSPACE_ALLOWLIST, ALL_ELIGIBLE_WORKSPACES]
              description: |
                Service-level rollout shape for the read-only research
                capability. Session/workspace eligibility is evaluated per run.
            mcpHost:
              type: boolean
            servicePty:
              type: boolean
            repositoryBinding:
              type: boolean
              description: Cloud Git workspace (detailed design §10.5). Off by default.
            managedClone:
              type: boolean
            remoteWorkspaceLane:
              type: boolean
            remoteFileWrite:
              type: boolean
            gitLocalCommit:
              type: boolean
            gitRemotePush:
              type: boolean
            pullRequestCreate:
              type: boolean
            signedCommit:
              type: boolean
            multiRepositoryLane:
              type: boolean
        limits:
          type: object
          properties:
            maxDiffBytes:
              type: integer
              format: int64
            maxEventPage:
              type: integer
            maxVisibleDeltaChars:
              type: integer
        multiClient:
          type: object
          nullable: true
          properties:
            contractVersion:
              type: string
            mode:
              type: string
              enum: [SHARED_STRICT, LEGACY_COMPAT, OWNED_PRIVATE]
            lifecycle:
              type: string
            registrationRequiredForMutation:
              type: boolean
            limits:
              type: object
              additionalProperties: true
        operations:
          type: array
          description: Operation-level availability generated from the wired service routes.
          items:
            $ref: "#/components/schemas/OperationCapability"
    OperationCapability:
      type: object
      required: [id, availability, contractVersion]
      properties:
        id:
          type: string
        availability:
          type: string
          enum: [AVAILABLE, DEGRADED, UNAVAILABLE]
        reasonCode:
          type: string
          nullable: true
        limits:
          type: object
          additionalProperties: true
        contractVersion:
          type: string
