      operationId: listWorkspaceExecutions
      summary: List workspace executions for a project
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,128}$"
      responses:
        "200":
          description: Workspace execution list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceExecutionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v2/workspace-executions/{workspaceExecutionId}:
    get:
      operationId: getWorkspaceExecution
      summary: Read one workspace execution; lease expiry surfaces as leaseExpired
      parameters:
        - name: workspaceExecutionId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,128}$"
      responses:
        "200":
          description: Workspace execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceExecutionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v2/workspace-executions/{workspaceExecutionId}/lease:
    post:
      operationId: renewWorkspaceExecutionLease
      summary: |
        Renew the lease with fencing. A stale leaseId/fencingToken fails
        closed with WORKSPACE_LEASE_LOST.
      parameters:
        - name: workspaceExecutionId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,128}$"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceExecutionLeaseRenewRequest"
      responses:
        "200":
          description: Lease renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceExecutionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v2/workspace-executions/{workspaceExecutionId}/handoff:
    post:
      operationId: handoffWorkspaceExecution
      summary: |
        Mark READY_FOR_HANDOFF after re-checking target drift; a moved
        baseline fails closed into NEEDS_ATTENTION with an Attention item.
      parameters:
        - name: workspaceExecutionId
          in: path
          required: true
          schema:
            type: string
