    "/personal/v1/transcriptions": {
      "post": {
        "operationId": "submitPersonalTranscription",
        "description": "INTERACT scope. One fixed owner-configured FunASR offline provider. Strict 44-byte PCM16 mono 16000Hz WAV, 0.2-60 seconds, at most 1920044 bytes. No client URL, filenames or provider credentials. Persist original key/hash before dispatch; no automatic provider retry.",
        "security": [
          {
            "bearer": []
          }
        ],
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "metadata",
                  "audio"
                ],
                "properties": {
                  "metadata": {
                    "$ref": "#/components/schemas/TranscriptionMetadata"
                  },
                  "audio": {
                    "type": "string",
                    "format": "binary"
                  }
                }
              },
              "encoding": {
                "metadata": {
                  "contentType": "application/json"
                },
                "audio": {
                  "contentType": "audio/wav"
                }
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Original request fact only. A transcription never sends a session message. UNKNOWN is not permission to retry the provider. Text expires after 24 hours.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TranscriptionResult"
                }
              }
            }
          },
          "409": {
            "description": "Original key payload mismatch"
          },
          "422": {
            "description": "Invalid WAV format or duration"
          },
          "429": {
            "description": "Bounded queue/history full"
          },
          "503": {
            "description": "Host transcription not configured"
          }
        }
      }
    },
