    "schemas": {
      "InvitationRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "requestId",
          "actions"
        ],
        "properties": {
          "requestId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
          },
          "sessions": {
            "type": "array",
            "minItems": 1,
            "maxItems": 100,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
            }
          },
          "actions": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "OBSERVE",
                "CONTROL",
                "INTERACT",
                "APPROVE",
                "ASSIGN",
                "COLLABORATE",
                "ADOPT",
                "LAUNCH"
              ]
            }
          },
          "resources": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/PersonalResource"
            }
          },
          "launchScopes": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/PersonalLaunchScope"
            }
          }
        },
        "oneOf": [
          {
            "required": [
              "sessions"
            ],
            "not": {
              "anyOf": [
                {
                  "required": [
                    "resources"
                  ]
                },
                {
                  "required": [
                    "launchScopes"
                  ]
                }
              ]
            }
          },
          {
            "required": [
              "resources"
            ],
            "not": {
              "required": [
                "sessions"
              ]
            }
          }
        ],
        "description": "Resource v2 is canonical. Legacy sessions input migrates to ACS_SESSION only. Empty resources requires an explicit launch scope. LAUNCH never grants observation of other tasks; accepted creation adds only the proven exact task. Old clients cannot overwrite native grants."
      },
      "PairingRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "pairingRequestId",
          "inviteId",
          "inviteSecret",
          "installationId",
          "label",
          "pollingSecretHash"
